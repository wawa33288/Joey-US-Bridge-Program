"The military"], "ans": 1}, {"q": "What does Greek 'demos' mean?", "opts": ["Power", "Law", "People", "Land"], "ans": 2}]}, {"num": 2, "title": "The Constitution", "read": {"title": "The Supreme Law of the Land", "text": "The United States Constitution is the most important document in American government. It was written in 1787 in Philadelphia and went into effect in 1788. The Constitution sets up the structure of the government and the rights of citizens. It begins with a famous phrase: 'We the People,' which shows that the government's power comes from the citizens. The Constitution has seven main sections called Articles. The first three Articles describe the three branches of government. The Constitution can be changed through a process called an amendment. The first ten amendments are called the Bill of Rights and protect important freedoms like speech, religion, and a fair trial.", "vids": []}, "grammar": {"std": "L.4.3.c", "topic": "Formal vs. Informal English", "lesson": "English has two registers: formal and informal. Formal English is used in school essays, official letters, and speeches. Informal English is used with friends and family. Formal: complete sentences, no contractions, precise vocabulary. Informal: contractions (don't, can't), slang, short sentences. Example — Informal: 'Can't believe how old the Constitution is!' Formal: 'The Constitution is a remarkable document that has guided the nation for over 200 years.'", "exercises": [{"type": "mc", "q": "Which sentence is written in formal English?", "opts": ["The Constitution is super old and really important.", "The Constitution, written in 1787, remains the supreme law of the United States.", "OMG the founders were so smart!", "The Constitution is kinda cool I guess."], "ans": 1}, {"type": "fill", "sentence": "In a formal essay, instead of writing 'can't,' you should write ___.", "ans": "cannot", "hint": "Write out the contraction in full."}, {"type": "spot", "q": "Click the word or phrase that makes this sentence informal:", "words": ["The", "Constitution", "is", "a", "super", "important", "document", "for", "America."], "errorIdx": 4, "errorCorrect": "very/critically", "explain": "'Super' is informal slang. Replace it with 'very,' 'critically,' or 'profoundly' for formal writing."}]}, "write": {"milestone": "Week 2 — Opening Paragraph of Letter", "prompt": "Write the opening paragraph of your letter. State who you are, why you are writing, and what issue you care about. Use formal English — no contractions, no slang. Begin: 'Dear Representative [Name], My name is ___ and I am a student in grade ___...'"}, "words": [{"w": "amendment", "ph": "uh-MEND-ment", "pos": "noun", "def": "An official change or addition to a law or document", "ex": "The First Amendment protects freedom of speech."}, {"w": "preamble", "ph": "PREE-am-bul", "pos": "noun", "def": "An introduction to an important document that explains its purpose", "ex": "'We the People' is the beginning of the Constitution's preamble."}, {"w": "ratify", "ph": "RAT-ih-fy", "pos": "verb", "def": "To officially approve a law or document by voting", "ex": "The states ratified the Constitution in 1788."}, {"w": "article", "ph": "AR-tih-kul", "pos": "noun", "def": "A separate section of a legal document", "ex": "Article I of the Constitution creates the legislative branch."}, {"w": "supreme", "ph": "soo-PREEM", "pos": "adjective", "def": "Highest in power, authority, or importance", "ex": "The Constitution is the supreme law of the United States."}, {"w": "principle", "ph": "PRIN-sih-pul", "pos": "noun", "def": "A basic truth or rule that guides behavior or government", "ex": "Democracy is built on the principle that all people are equal."}, {"w": "convention", "ph": "kun-VEN-shun", "pos": "noun", "def": "A large, formal meeting for a specific purpose", "ex": "The Constitutional Convention was held in Philadelphia in 1787."}, {"w": "delegate", "ph": "DEL-ih-gut", "pos": "noun", "def": "A person chosen to represent others at a meeting", "ex": "Delegates from all 13 states met to write the Constitution."}, {"w": "sovereignty", "ph": "SOV-er-en-tee", "pos": "noun", "def": "Supreme power or authority; the right to self-govern", "ex": "The Constitution places sovereignty in the hands of the people."}, {"w": "federal", "ph": "FED-er-ul", "pos": "adjective", "def": "Relating to the central national government rather than state governments", "ex": "The federal government is located in Washington D.C."}], "quiz": [{"q": "When was the U.S. Constitution written?", "opts": ["1776", "1781", "1787", "1800"], "ans": 2}, {"q": "What are the first ten amendments called?", "opts": ["The Declaration of Rights", "The Bill of Rights", "The Articles of Freedom", "The Founding Laws"], "ans": 1}, {"q": "What does 'We the People' show?", "opts": ["The president is most powerful", "Power comes from the citizens", "Congress runs the country", "Judges write the laws"], "ans": 1}, {"q": "What is an amendment?", "opts": ["A section of the Constitution", "An official change to a law", "A type of court case", "A presidential order"], "ans": 1}, {"q": "What is a formal register of English?", "opts": ["Using slang and contractions", "Using complete sentences and precise vocabulary", "Texting with abbreviations", "Talking to friends casually"], "ans": 1}, {"q": "What does 'ratify' mean?", "opts": ["To write a law", "To vote to officially approve something", "To change the government", "To elect a president"], "ans": 1}, {"q": "What is a preamble?", "opts": ["A type of amendment", "An introduction explaining a document's purpose", "A section about the president", "A list of laws"], "ans": 1}, {"q": "How many main Articles does the Constitution have?", "opts": ["3", "5", "7", "10"], "ans": 2}, {"q": "Which city hosted the Constitutional Convention?", "opts": ["Boston", "Washington D.C.", "New York", "Philadelphia"], "ans": 3}, {"q": "What is sovereignty?", "opts": ["A type of law", "Supreme power and the right to self-govern", "A government department", "A national symbol"], "ans": 1}]}, {"num": 3, "title": "The Three Branches", "read": {"title": "Checks and Balances: Three Branches of Government", "text": "The U.S. government is divided into three branches to prevent any one person or group from having too much power. The Legislative Branch, which is Congress, makes the laws. Congress has two parts: the Senate and the House of Representatives. The Executive Branch, led by the President, carries out the laws. The President is also commander-in-chief of the military. The Judicial Branch, led by the Supreme Court, interprets the laws and makes sure they follow the Constitution. This system is called 'checks and balances' because each branch can check, or limit, the power of the others. No branch is more powerful than the others.", "vids": [{"label": "The Three Branches of Government", "url": "https://www.youtube.com/watch?v=W9H3gvnN468", "note": "Electoral College — TED-Ed"}]}, "grammar": {"std": "L.4.2.d", "topic": "Spelling Commonly Confused Words", "lesson": "Some words are tricky because they sound alike but mean different things. These are called homophones or commonly confused words. Examples: their (belonging to them) / there (a place) / they're (they are). Your (belonging to you) / you're (you are). Its (belonging to it) / it's (it is). Always check: can you replace the word with 'they are' or 'it is'? If yes, use the contraction!", "exercises": [{"type": "mc", "q": "Choose the correct word: 'The three branches have ___ own responsibilities.'", "opts": ["there", "they're", "their", "theyre"], "ans": 2}, {"type": "fill", "sentence": "The Supreme Court does ___ job of interpreting the Constitution. (its or it's?)", "ans": "its", "hint": "Can you replace it with 'it is'? No — so use 'its' (possessive)."}, {"type": "spot", "q": "Click the incorrect word: 'The President and there cabinet meet in the White House.'", "words": ["The", "President", "and", "there", "cabinet", "meet", "in", "the", "White", "House."], "errorIdx": 3, "errorCorrect": "their", "explain": "'There' refers to a place. Here we need 'their' (belonging to them — the President's cabinet)."}]}, "write": {"milestone": "Week 3 — Body Paragraph: The Problem", "prompt": "Write a paragraph explaining the problem or issue you care about. Give at least 2 facts or reasons why this issue is important. Use formal language and check your spelling — especially their/there/they're and its/it's."}, "words": [{"w": "legislative", "ph": "LEJ-ih-slay-tiv", "pos": "adjective", "def": "Related to making laws", "ex": "Congress is the legislative branch of government."}, {"w": "executive", "ph": "eg-ZEK-yoo-tiv", "pos": "adjective", "def": "Related to carrying out and enforcing laws", "ex": "The President leads the executive branch."}, {"w": "judicial", "ph": "joo-DIH-shul", "pos": "adjective", "def": "Related to courts and the interpretation of laws", "ex": "The Supreme Court is the highest judicial court in the country."}, {"w": "interpret", "ph": "in-TER-pret", "pos": "verb", "def": "To explain the meaning of something, especially a law", "ex": "The Supreme Court interprets whether laws follow the Constitution."}, {"w": "veto", "ph": "VEE-toh", "pos": "noun/verb", "def": "The power to reject a law; to reject a law", "ex": "The President can veto a bill passed by Congress."}, {"w": "override", "ph": "oh-ver-RYD", "pos": "verb", "def": "To cancel or reverse a decision, especially a president's veto", "ex": "Congress can override a presidential veto with a two-thirds vote."}, {"w": "Congress", "ph": "KON-gres", "pos": "noun", "def": "The U.S. national legislature, made up of the Senate and the House of Representatives", "ex": "Congress passes laws for the entire country."}, {"w": "Senate", "ph": "SEN-ut", "pos": "noun", "def": "The upper house of Congress, with two senators from each state", "ex": "There are 100 senators in the U.S. Senate."}, {"w": "cabinet", "ph": "KAB-ih-net", "  in Washington D.C., handles issues that affect the whole country — like national defense, foreign policy, and printing money. State governments handle issues closer to home — like schools, roads, police, and local laws. This sharing of power between federal and state governments is called federalism. Some powers belong only to the federal government. Some belong only to states. And some are shared. For example, both the federal and state governments can collect taxes and build roads. Understanding federalism helps us know who to contact when we have a problem or idea.", "vids": []}, "grammar": {"std": "L.4.1.c", "topic": "Modal Auxiliaries: can, may, must, should, would, could", "lesson": "Modal auxiliaries are helping verbs that express possibility, permission, ability, or obligation. 'Can' = ability. 'May' = permission. 'Must' = obligation (required). 'Should' = recommendation. 'Would' = conditional. 'Could' = past ability or possibility. Example: 'Citizens can vote.' (ability) 'You may enter the building.' (permission) 'You must pay taxes.' (obligation) 'You should register to vote.' (recommendation)", "exercises": [{"type": "mc", "q": "'Students ___ attend school until age 16 in most states.' Which modal shows obligation?", "opts": ["can", "may", "must", "should"], "ans": 2}, {"type": "fill", "sentence": "If you want to learn about your rights, you ___ read the Bill of Rights. (recommendation)", "ans": "should", "hint": "Which modal means 'it is a good idea to'?"}, {"type": "spot", "q": "Click the modal auxiliary in: 'The president must sign a bill for it to become law.'", "words": ["The", "president", "must", "sign", "a", "bill", "for", "it", "to", "become", "law."], "errorIdx": 2, "errorCorrect": "must", "explain": "'Must' is the modal auxiliary expressing obligation — the president is required to sign the bill."}]}, "write": {"milestone": "Week 4 — Body Paragraph: Your Solution", "prompt": "Write a paragraph suggesting a solution to the issue you described. rican", "text": "The Bill of Rights is the name for the first ten amendments to the U.S. Constitution. These amendments were added in 1791 to protect the rights of individual citizens. The First Amendment protects freedom of speech, religion, press, and peaceful assembly. The Second Amendment protects the right to bear arms. The Fourth Amendment protects citizens from unreasonable searches. The Fifth Amendment says a person cannot be forced to testify against themselves. The Sixth Amendment guarantees the right to a speedy, fair trial. The Bill of Rights ensures that the government cannot take away these basic freedoms from the people.", "vids": []}, "grammar": {"std": "L.4.3.a", "topic": "Strong Action Verbs", "lesson": "Strong action verbs make your writing more powerful and specific. Instead of 'The government does things for people,' write 'The government protects, serves, and represents the people.' Weak verbs: be, do, get, have, make. Strong verbs: protect, guarantee, ensure, enforce, represent, challenge, debate, advocate. Strong verbs show exactly what happens!", "exercises": [{"type": "mc", "q": "Which sentence uses a stronger verb?", "opts": ["The First Amendment does something for free speech.", "The First Amendment protects the right to free speech.", "The First Amendment is about free speech.", "The First Amendment has free speech rules."], "ans": 1}, {"type": "fill", "sentence": "Citizens can ___ for change by writing letters, voting, and protesting peacefully. (use a strong verb)", "ans": "advocate", "hint": "What strong verb means to actively support or fight for something?"}, {"type": "spot", "q": "Click the weak verb that should be replaced with a stronger one:", "words": ["The", "government", "makes", "laws", "to", "protect", "citizens'", "rights."], "errorIdx": 2, "errorCorrect": "creates/enacts/establishes", "explain": "'Makes' is weak. 'Creates,' 'enacts,' or 'establishes' are stronger, more precise verbs for how laws come to be."}]}, "write": {"milestone": "Week 1 — Title & First Commitment", "prompt": "Start your Citizen's Pledge. Give it a title ('My Pledge as an American Citizen'). Write your first commitment: a right you are grateful for AND how you will honor it. Example: 'I am grateful for the right to free speech, and I pledge to use my voice to speak up for fairness.'"}, "words": [{"w": "amendment", "ph": "uh-MEND-ment", "pos": "noun", "def": "An official change or addition to a document or law", "ex": "The First Amendment protects freedom of speech."}, {"w": "guarantee", "ph": "gar-an-TEE", "pos": "verb/noun", "def": "To promise something will happen; a firm promise", "ex": "The Sixth Amendment guarantees the right to a fair trial."}, {"w": "assembly", "ph": "uh-SEM-blee", "pos": "noun", "def": "A gathering of people for a common purpose", "ex": "The First Amendment protects the right to peaceful assembly."}, {"w": "press", "ph": "PRES", "pos": "noun", "def": "Newspapers, magazines, and media that report the news", "ex": "Freedom of the press allows journalists to report without government control."}, {"w": "testify", "ph": "TES-tih-fy", "pos": "verb", "def": "To give evidence or make a statement in a court of law", "ex": "The Fifth Amendment says you cannot be forced to testify against yourself."}, {"w": "unreasonable", "ph": "un-REE-zun-uh-bul", "pos": "adjective", "def": "Not fair or sensible; going beyond what is acceptable", "ex": "The Fourth Amendment protects citizens from unreasonable searches."}, {"w": "petition", "ph": "peh-TIH-shun", "pos": "noun/verb", "def": "A written request signed by many people asking for change", "ex": "Citizens can petition the government when they disagree with a law."}, {"w": "advocate", "ph": "AD-voh-kayt", "pos": "verb/noun", "def": "To publicly support a cause; a person who does this", "ex": "She advocates for the rights of children in her community."}, {"w": "enforce", "ph": "en-FORS", "pos": "verb", "def": "To make sure a law or rule is obeyed", "ex": "It is the police's job to enforce laws fairly."}, {"w": "liberty", "ph": "LIB-er-tee", "pos": "noun", "def": "Freedom from unfair control by others or the government", "ex": "The Bill of Rights protects the liberty of every American citizen."}], "book_quiz": {"title": "Duck for President — Reading Quiz", "questions": [{"q": "Why did Duck want to run against Farmer Brown?", "opts": ["He wanted more food", "He was tired of doing chores on the farm", "He wanted to be famous", "He was bored"], "ans": 1}, {"q": "What was the first election Duck won?", "opts": ["President of the United States", "Governor of the state", "Farm manager", "Mayor"], "ans": 2}, {"q": "What did Duck discover about each new job he won?", "opts": ["It was always fun", "It was easy", "It came with more work and responsibility", "It had no rules"], "ans": 2}, {"q": "What lesson does the book teach about leadership?", "opts": ["Leaders get to relax", "Leadership is fun and easy", "Leadership comes with hard work and responsibility", "Everyone should be president"], "ans": 2}, {"q": "What did Duck do at the end of the book?", "opts": ["Won the presidency and stayed", "Wrote a book about farming", "Gave up the presidency and went back to the farm", "Started a new country"], "ans": 2}]}, "quiz": [{"q": "When was the Bill of Rights added to the Constitution?", "opts": ["1776", "1787", "1791", "1800"], "ans": 2}, {"q": "How many amendments are in the Bill of Rights?", "opts": ["5", "7", "10", "13"], "ans": 2}, {"q": "Which amendment protects freedom of speech?", "opts": ["First", "Second", "Fourth", "Sixth"], "ans": 0}, {"q": "Which amendment protects against unreasonable searches?", "opts": ["First", "Second", "Fourth", "Sixth"], "ans": 2}, {"q": "What does 'guarantee' mean?", "opts": ["To take away", "To firmly promise", "To limit", "To ignore"], "ans": 1}, {"q": "What does 'testify' mean?", "opts": ["To vote", "To make laws", "To give evidence in court", "To run for office"], "ans": 2}, {"q": "What is  are voting today.", "Citizens have voted in every election.", "Citizens will vote tomorrow."], "ans": 2}, {"type": "fill", "sentence": "By the time the polls closed, all registered voters ___ cast their ballots. (past perfect)", "ans": "had", "hint": "Past perfect = had + past participle. What helping verb do you need?"}, {"type": "spot", "q": "Click the verb phrase that shows present progressive tense:", "words": ["Citizens", "are", "learning", "about", "their", "rights", "and", "responsibilities."], "errorIdx": 1, "errorCorrect": "are learning", "explain": "'Are learning' is present progressive — it shows an action that is happening right now and is ongoing."}]}, "write": {"milestone": "Week 2 — Second & Third Commitments", "prompt": "Add two more commitments to your Citizen's Pledge. One about a RESPONSIBILITY you will fulfill (like voting when you are old enough, obeying laws, or volunteering). One about how you will treat OTHER people's rights. Use at least one perfect tense verb."}, "words": [{"w": "responsibility", "ph": "rih-spon-suh-BIL-ih-tee", "pos": "noun", "def": "A duty or obligation you are expected to fulfill", "ex": "Paying taxes is a legal responsibility of adult citizens."}, {"w": "jury", "ph": "JOO-ree", "pos": "noun", "def": "A group of citizens chosen to decide a court case", "ex": "Serving on a jury is an important civic responsibility."}, {"w": "volunteer", "ph": "vol-un-TEER", "pos": "verb/noun", "def": "To give your time freely to help others; a person who does this", "ex": "Many good citizens volunteer at local food banks and shelters."}, {"w": "entitled", "ph": "en-TY-teld", "pos": "adjective", "def": "Having the right to have or do something", "ex": "Every citizen is entitled to a fair trial under the Constitution."}, {"w": "civic", "ph": "SIV-ik", "pos": "adjective", "def": "Relating to citizenship, community, and public duties", "ex": "Voting and volunteering are important civic responsibilities."}, {"w": "obey", "ph": "oh-BAY", "pos": "verb", "def": "To follow rules, laws, or instructions", "ex": "Citizens are expected to obey the laws of their city, state, and country."}, {"w": "community", "ph": "kuh-MYOO-nih-tee", "pos": "noun", "def": "A group of people living in the same area or sharing common interests", "ex": "Good citizens work to make their community a better place."}, {"w": "informed", "ph": "in-FORMD", "pos": "adjective", "def": "Having knowledge and awareness about current events and issues", "ex": "Staying informed by reading the news is part of being a good citizen."}, {"w": "respect", "ph": "rih-SPEKT", "pos": "noun/verb", "def": "Treating people with dignity and consideration", "ex": "Good citizens respect the rights and opinions of others, even when they disagree."}, {"w": "democracy", "ph": "deh-MOK-ruh-see", "pos": "noun", "def": "A government where citizens hold power through voting and participation", "ex": "Democracy depends on citizens who take their rights and responsibilities seriously."}], "quiz": [{"q": "What is a right?", "opts": ["Something you choose to do for fun", "Something you are legally entitled to", "A rule you must follow", "A government law"], "ans": 1}, {"q": "What is a legal responsibility in the U.S.?", "opts": ["Voting", "Volunteering", "Paying taxes", "Joining a sports team"], "ans": 2}, {"q": "What is a civic duty?", "opts": ["Something required by law", "A responsibility that strengthens democracy but is not legally required", "A type of right", "A court ruling"], "ans": 1}, {"q": "What is the present perfect tense of 'vote'?", "opts": ["voted", "is voting", "has voted", "will vote"], "ans": 2}, {"q": "Which tense shows an action happening right now and ongoing?", "opts": ["Past perfect", "Present perfect", "Present progressive", "Future perfect"], "ans": 2}, {"q": "What does 'entitled' mean?", "opts": ["Required to do", "Having the right to have or do something", "Responsible for others", "Banned from doing"], "ans": 1}, {"q": "What is a jury?", "opts": ["A group of judges", "Citizens chosen to decide a court case", "A government department", "The president's advisors"], "ans": 1}, {"q": "What does 'civic' mean?", "opts": ["Related to farming", "Related to science", "Related to citizenship and community", "Related to the military"], "ans": 2}, {"q": "Which is an example of volunteering?", "opts": ["Paying taxes", "Serving on a jury", "Helping at a food bank for free", "Registering to vote"], "ans": 2}, {"q": "Why do rights and responsibilities go together in a democracy?", "opts": ["They don't — rights are more important", "Rights only belong to some people", "Both make democracy strong and fair for everyone", "Responsibilities cancel out rights"], "ans": 2}]}, {"num": 3, "title": "Community Helpers", "read": {"title": "People Who Serve Our Communities", "text": "Community helpers are people who work to keep our communities safe, healthy, and running smoothly. Firefighters, police officers, and paramedics respond to emergencies. Teachers educate the next generation. Doctors and nurses care for the sick. Sanitation workers keep our streets clean. Librarians help us find information and love reading. Elected officials make the laws and policies that affect everyone. All community helpers contribute something important. Many community helpers choose public service — jobs that help the public — even though they could earn more money in other fields. Respecting and appreciating community helpers is part of being a good citizen.", "vids": [{"label": "Schoolhouse Rock: Three Ring Government", "url": "https://www.youtube.com/watch?v=MZxW6V8eaPI", "note": "Three Ring Government"}]}, "grammar": {"std": "L.4.1.a", "topic": "Relative Adverbs: where, when, why", "lesson": "Relative adverbs connect a clause to a noun that refers to a place, time, or reason. 'Where' connects to a place. 'When' connects to a time. 'Why' connects to a reason. Examples: 'The school where I study has great teachers.' (place) 'The day when we vote is very important.' (time) 'The reason why she volunteered is her love for her community.' (reason)", "exercises": [{"type": "mc", "q": "Choose the correct relative adverb: 'The fire station ___ firefighters work is on Oak Street.'", "opts": ["when", "why", "which", "where"], "ans": 3}, {"type": "fill", "sentence": "Election Day is the day ___ all eligible citizens cast their votes.", "ans": "when", "hint": "We need a relative adverb that connects to a time."}, {"type": "spot", "q": "Click the relative adverb in: 'The reason why community helpers are important is that they keep us safe.'", "words": ["The", "reason", "why", "community", "helpers", "are", "important", "is", "that", "they", "keep", "us", "safe."], "errorIdx": 2, "errorCorrect": "why", "explain": "'Why' is the relative adverb connecting 'reason' to the clause that explains it."}]}, "write": {"milestone": "Week 3 — Fourth Commitment", "prompt": "Add a commitment about community service to your Citizen's Pledge. Choose one way you will serve your community when you are older (volunteer work, a career in public service, etc.) and explain why it matters. Use a relative adverb (where, when, or why) in your writing."}, "words": [{"w": "paramedic", "ph": "pair-uh-MED-ik", "pos": "noun", "def": "A trained medical worker who provides emergency care", "ex": "The paramedic arrived quickly and helped the injured person."}, {"w": "sanitation", "ph": "san-ih-TAY-shun", "pos": "noun", "def": "Systems and services that keep an environment clean and healthy", "ex": "Sanitation workers collect garbage and recycling from homes each week."}, {"w": "public service", "ph": "PUB-lik SER-vis", "pos": "noun", "def": "Work done for the benefit of the public, often in government or nonprofit jobs", "ex": "Teaching and firefighting are examples of public service careers."}, {"w": "contribute", "ph": "kun-TRIB-yoot", "pos": "verb", "def": "To give or add something valuable to a group or cause", "ex": "Every community helper contributes something essential to society."}, {"w": "emergency", "ph": "ih-MER-jen-see", "pos": "noun", "def": "A sudden serious situation requiring immediate action", "ex": "Firefighters respond to emergencies like fires and accidents."}, {"w": "policy", "ph": "PAH-lih-see", "pos": "noun", "def": "A plan or set of rules adopted by a government or organization", "ex": "City council members vote on policies that affect the whole community."}, {"w": "appreciate", "ph": "uh-PREE-shee-ayt", "pos": "verb", "def": "To recognize and be grateful for the value of something or someone", "ex": "We should appreciate the hard work of community helpers every day."}, {"w": "generation", "ph": "jen-er-AY-shun", "pos": "noun", "def": "All the people born and living at about the same time", "ex": "Teachers help educate each new generation of citizens."}, {"w": "eligible", "ph": "EL-ih-jih-bul", "pos": "adjective", "def": "Meeting the requirements to do or have something", "ex": "Citizens must be 18 and registered to be eligible to vote."}, {"w": "dedicate", "ph": "DED-ih-kayt", "pos": "verb", "def": "To commit yourself to a purpose or cause", "ex": "Many public servants dedicate their careers to helping others."}], "quiz": [{"q": "Which community helper responds to fires?", "opts": ["Teacher", "Doctor", "Firefighter", "Librarian"], "ans": 2}, {"q": "What is public service?", "opts": ["Working for a private company", "Work done for the benefit of the public", "A military career only", "Running for president"], "ans": 1}, {"q": "Which relative adverb connects to a place?", "opts": ["when", "why", "where", "which"], "ans": 2}, {"q": "Which relative adverb connects to a time?", "opts": ["where", "why", "who", "when"], "ans": 3}, {"q": "Which relative adverb connects to a reason?", "opts": ["where", "when", "why", "which"], "ans": 2}, {"q": "What does 'eligible' mean?", "opts": ["Required by law", "Meeting requirements to do something", "Forbidden to participate", "Voted into office"], "ans": 1}, {"q": "What does 'contribute' mean?", "opts": ["To take something away", "To give or add something valuable", "To vote in an election", "To make a law"], "ans": 1}, {"q": "What is a paramedic?", "opts": ["A police officer", "A fire inspector", "A trained emergency medical worker", "A government official"], "ans": 2}, {"q": "What does 'sanitation' relate to?", "opts": ["Education", "Laws", "Keeping environments clean and healthy", "Elections"], "ans": 2}, {"q": "Why do community helpers choose public service?", "opts": ["Because it pays the most", "Because they care about helping people", "Because it is the easiest job", "Because the law requires it"], "ans": 1}]}, {"num": 4, "title": "Rules & Laws", "read": {"title": "Why We Need Rules and Laws", "text": "Rules and laws help people live together safely and fairly. A rule is a guideline for behavior, often in a specific place like a school or home. A law is an official rule made by a government that everyone in a community, state, or country must follow. Laws protect people's rights and safety. Speed limits protect drivers and pedestrians. Anti-discrimination laws protect people from unfair treatment. Environmental laws protect nature. When someone breaks a law, there are consequences — which might include fines or jail time. The legal system in the United States is designed to be fair: everyone is considered innocent until proven guilty.", "vids": []}, "grammar": {"std": "L.4.1.g", "topic": "Frequently Confused Words", "lesson": "Some words are easy to mix up! Here are some important pairs: Accept (to receive) / Except (excluding). Affect (verb: to influence) / Effect (noun: a result). Than (comparison) / Then (next in time). Principal (school leader) / Principle (a rule or belief). Loose (not tight) / Lose (to not win or to misplace). Tip: If you can replace the word with 'a result' → use 'effect.' If you can replace it with 'next' → use 'then.'", "exercises": [{"type": "mc", "q": "'Breaking the law can ___ many people in the community.' (affect or effect?)", "opts": ["effect", "affect", "efect", "affekt"], "ans": 1}, {"type": "fill", "sentence": "The ___ of speeding can be a car accident. (a result = ?)", "ans": "effect", "hint": "Can you replace it with 'a result'? Yes — so use 'effect' (noun)."}, {"type": "spot", "q": "Click the incorrect word: 'Laws affect everyone accept the very young.'", "words": ["Laws", "affect", "everyone", "accept", "the", "very", "young."], "errorIdx": 3, "errorCorrect": "except", "explain": "'Accept' means to receive. Here we need 'except' meaning 'excluding' or 'not including.'"}]}, "write": {"milestone": "Week 4 — Fifth Commitment", "prompt": "Add a commitment about following rules and laws fairly to your Citizen's Pledge. Include: (1) a law or rule you think is important, (2) why you will follow it, and (3) what you will do if you think a rule is unfair. Check your writing for affect/effect and accept/except."}, "words": [{"w": "consequence", "ph": "KON-seh-kwents", "pos": "noun", "def": "A result or effect of an action, especially a punishment for breaking rules", "ex": "The consequence of speeding may be a fine or an accident."}, {"w": "innocent", "ph": "IN-oh-sent", "pos": "adjective", "def": "Not guilty of a crime; pure and free from wrongdoing", "ex": "In the U.S. legal system, a person is innocent until proven guilty."}, {"w": "pedestrian", "ph": "peh-DES-tree-un", "pos": "noun", "def": "A person who is walking, especially on a public road", "ex": "Crosswalks protect pedestrians from traffic."}, {"w": "discrimination", "ph": "dis-krim-ih-NAY-shun", "pos": "noun", "def": "Unfair treatment of a person or group based on characteristics like race or gender", "ex": "Anti-discrimination laws protect people from being treated unfairly."}, {"w": "enforce", "ph": "en-FORS", "pos": "verb", "def": "To make sure rules or laws are followed", "ex": "Police officers enforce traffic laws to keep drivers safe."}, {"w": "guilty", "ph": "GIL-tee", "p  of law", "A result or punishment for an action", "A government rule"], "ans": 2}, {"q": "What is justice?", "opts": ["Punishment without trial", "Fairness in the treatment of people under the law", "A type of court", "Enforcing rules harshly"], "ans": 1}, {"q": "What does 'pedestrian' mean?", "opts": ["A type of vehicle", "A government official", "A person walking on a public road", "A police officer"], "ans": 2}, {"q": "What is a regulation?", "opts": ["A type of right", "An official rule issued by a government authority", "A school guideline", "A court sentence"], "ans": 1}]}, {"num": 5, "title": "Making a Difference", "read": {"title": "Young People Who Changed the World", "text": "You don't have to be an adult to make a difference in your community or country. Many young people throughout history have worked hard to change things for the better. Claudette Colvin was just 15 years old in 1955 when she refused to give up her bus seat to a white passenger in Montgomery, Alabama — nine months before Rosa Parks did the same. Jazz Jennings became an advocate for transgender rights as a young child. Malala Yousafzai, from Pakistan, started speaking up for girls' education when she was just 11 years old. These young leaders show that age is not a barrier to making a difference. Everyone has a voice that matters.", "vids": []}, "grammar": {"std": "L.4.4.b", "topic": "Latin and Greek Roots: civ- and leg-", "lesson": "The root 'civ-' (Latin) means 'citizen' or 'city.' The root 'leg-' (Latin) means 'law.' Knowing these helps with many important words: civil (relating to citizens), civics (the study of citizenship), civilization (a developed society), legal (relating to law), legislature (law-making body), legislate (to make laws), legitimate (lawful). These roots appear in many important words about government!", "exercises": [{"type": "mc", "q": "If 'civ-' means citizen, what does 'civics' most likely mean?", "opts": ["The study of science", "The study of citizenship and
