def": "Laws that have been proposed or enacted by a government", "ex": "New legislation was passed to protect the environment."}, {"w": "legitimate", "ph": "leh-JIT-ih-mut", "pos": "adjective", "def": "Conforming to the law; fair and reasonable", "ex": "Every citizen has a legitimate right to vote."}, {"w": "movement", "ph": "MOOV-ment", "pos": "noun", "def": "A group of people working together to achieve a social or political goal", "ex": "The Civil Rights Movement changed America's laws and society."}, {"w": "inspire", "ph": "in-SPY-er", "pos": "verb", "def": "To fill someone with a strong urge to do something creative or courageous", "ex": "Young leaders like Malala inspire others around the world."}, {"w": "equality", "ph": "ih-KWAH-lih-tee", "pos": "noun", "def": "The state of having the same rights and opportunities as everyone else", "ex": "The Civil Rights Movement fought for racial equality in America."}], "quiz": [{"q": "How old was Claudette Colvin when she refused to give up her bus seat?", "opts": ["12", "15", "18", "21"], "ans": 1}, {"q": "What does the Latin root 'civ-' mean?", "opts": ["Law", "Land", "Citizen or city", "Free"], "ans": 2}, {"q": "What does the Latin root 'leg-' mean?", "opts": ["People", "Land", "Free", "Law"], "ans": 3}, {"q": "What does 'civics' mean?", "opts": ["The study of science", "City planning", "The study of citizenship and government", "A type of law"], "ans": 2}, {"q": "What does 'legislate' mean?", "opts": ["To study citizenship", "To make laws", "To enforce rules", "To vote in an election"], "ans": 1}, {"q": "What did Malala Yousafzai advocate for?", "opts": ["Environmental protection", "Animal rights", "Girls' education", "Voting rights"], "ans": 2}, {"q": "What does 'equality' mean?", "opts": ["Having more rights than others", "Having the same rights and opportunities as everyone else", "Following all laws", "Being a good leader"], "ans": 1}, {"q": "What is a movement in the context of civil rights?", "opts": ["A type of dance", "A group working together for a social goal", "A law passed by Congress", "A type of election"], "ans": 1}, {"q": "What does 'legitimate' mean?", "opts": ["Illegal", "Unfair", "Conforming to the law; fair and reasonable", "Related to the president"], "ans": 2}, {"q": "What does 'barrier' mean?", "opts": ["A type of right", "Something that blocks or prevents progress", "A community helper", "A type of government law"], "ans": 1}]}]}, {"id": 5, "title": "American History Heroes", "sub": "People Who Shaped America", "color": "#d69e2e", "icon": "⭐", "book": null, "writing_project": {"title": "Biography Paragraph", "desc": "Write a 5-paragraph biography about an American hero you admire. Each week you'll research and write one paragraph."}, "weeks": [{"num": 1, "title": "The Founding Fathers", "read": {"title": "The Men Who Built a Nation", "text": "The Founding Fathers were the group of leaders who led the American Revolution and helped create the United States of America. The most well-known Founding Fathers include George Washington, Thomas Jefferson, Benjamin Franklin, John Adams, James Madison, and Alexander Hamilton. George Washington commanded the Continental Army and became the first President. Thomas Jefferson wrote most of the Declaration of Independence. Benjamin Franklin was a famous inventor, scientist, and diplomat who helped secure France's support during the Revolution. James Madison is often called the 'Father of the Constitution' because he played such an important role in writing it. These men took an enormous risk — they could have been executed as traitors by the British.", "vids": [{"label": "Independence Day for Kids", "url": "https://www.youtube.com/watch?v=PV_23e92Djw", "note": "Independence Day for Kids"}]}, "grammar": {"std": "L.4.2.b", "topic": "Apostrophes for Possession", "lesson": "An apostrophe + s ('s) shows that something belongs to someone. For singular nouns: add 's (Washington's army, Jefferson's pen). For plural nouns ending in s: add just an apostrophe (the Founders' ideas, the soldiers' courage). For plural nouns NOT ending in s: add 's (the children's school, the men's plan). Remember: apostrophes show ownership, not plurals! Never write 'apple's' when you mean more than one apple.", "exercises": [{"type": "mc", "q": "Which is correct? (showing something belonging to Jefferson)", "opts": ["Jeffersons pen", "Jefferson pen's", "Jefferson's pen", "Jeffersons' pen"], "ans": 2}, {"type": "fill", "sentence": "The ___ Declaration was signed in 1776. (the Declaration belonging to the Founders — plural possessive)", "ans": "Founders'", "hint": "Multiple founders own it together — plural possessive: Founders'"}, {"type": "spot", "q": "Click the word with the apostrophe used incorrectly:", "words": ["George", "Washington's", "army", "fought", "for", "the", "colonies'", "freedom."], "errorIdx": 0, "errorCorrect": "(all correct here — find the error)", "explain": "Actually both possessives here are correct: Washington's (singular) and colonies' (plural ending in s). Good job if you said none are wrong!"}]}, "write": {"milestone": "Week 1 — Choose Your Hero & Write Introduction", "prompt": "Choose an American hero for your biography. Write your introduction paragraph: Who is this person? When did they live? In one sentence, tell the most important thing they did. End with a hook — a sentence that makes the reader want to learn more."}, "words": [{"w": "revolution", "ph": "rev-uh-LOO-shun", "pos": "noun", "def": "A major change, often when people overthrow a government", "ex": "The American Revolution led to independence from Britain."}, {"w": "independence", "ph": "in-deh-PEN-dents", "pos": "noun", "def": "Freedom from control by another country or group", "ex": "The Declaration of Independence announced America's freedom from Britain."}, {"w": "diplomat", "ph": "DIP-loh-mat", "pos": "noun", "def": "A person who represents their country in dealings with other nations", "ex": "Benjamin Franklin was a skilled diplomat in France."}, {"w": "traitor", "ph": "TRAY-ter", "pos": "noun", "def": "A person who betrays their country or ruler", "ex": "The British considered the Founding Fathers to be traitors."}, {"w": "execute", "ph": "EK-seh-kyoot", "pos": "verb", "def": "To carry out; also, to put a person to death as punishment", "ex": "The Founders risked being executed if captured by the British."}, {"w": "Continental", "ph": "kon-tih-NEN-tul", "pos": "adjective", "def": "Relating to the American colonies during the Revolution", "ex": "George Washington led the Continental Army."}, {"w": "declaration", "ph": "dek-luh-RAY-shun", "pos": "noun", "def": "An official statement or announcement", "ex": "The Declaration of Independence was signed on July 4, 1776."}, {"w": "patriot", "ph": "PAY-tree-ut", "pos": "noun", "def": "A person who loves their country and supports its independence", "ex": "The Founding Fathers were patriots who risked everything for freedom."}, {"w": "ratify", "ph": "RAT-ih-fy", "pos": "verb", "def": "To formally approve or confirm something", "ex": "The states ratified the Constitution in 1788."}, {"w": "legacy", "ph": "LEG-uh-see", "pos": "noun", "def": "Something handed down from the past; the impact a person leaves behind", "ex": "George Washington's legacy as the first president shaped American history."}], "quiz": [{"q": "Who commanded the Continental Army?", "opts": ["Thomas Jefferson", "Benjamin Franklin", "George Washington", "John Adams"], "ans": 2}, {"q": "Who wrote most of the Declaration of Independence?", "opts": ["George Washington", "James Madison", "Benjamin Franklin", "Thomas Jefferson"], "ans": 3}, {"q": "Who is called the 'Father of the Constitution'?", "opts": ["Alexander Hamilton", "James Madison", "John Adams", "Thomas Jefferson"], "ans": 1}, {"q": "Which possessive is correct for a singular noun?", "opts": ["Washingtons army", "Washington's army", "Washingtons' army", "Washington army's"], "ans": 1}, {"q": "What does 'diplomat' mean?", "opts": ["A soldier", "A scientist", "A person who represents their country with other nations", "A judge"], "ans": 2}, {"q": "What does 'traitor' mean?", "opts": ["A hero", "A leader", "A person who betrays their country", "A founding father"], "ans": 2}, {"q": "What was signed on July 4, 1776?", "opts": ["The Constitution", "The Bill of Rights", "The Declaration of Independence", "The Articles of Confederation"], "ans": 2}, {"q": "What does 'legacy' mean?", "opts": ["A type of law", "The impact and things left behind from the past", "A founding document", "A military battle"], "ans": 1}, {"q": "For plural nouns ending in 's', the possessive is formed by:", "opts": ["Adding 's", "Adding just an apostrophe", "Adding es", "No apostrophe needed"], "ans": 1}, {"q": "What does 'ratify' mean?", "opts": ["To reject a law", "To write a document", "To formally approve something", "To go to war"], "ans": 2}]}, {"num": 2, "title": "Abolitionists & Freedom Fighters", "read": {"title": "Fighting to End Slavery", "text": "Slavery was one of the darkest parts of American history. For centuries, millions of African Americans were enslaved — forced to work without pay or freedom. Abolitionists were people who fought to end slavery. Frederick Douglass was born into slavery in Maryland but escaped to become one of the most powerful speakers and writers against slavery. Harriet Tubman escaped slavery and then risked her life to lead more than 70 people to freedom through the Underground Railroad — a secret network of safe houses. Sojourner Truth was a formerly enslaved woman who became a powerful speaker for both abolition and women's rights. These brave men and women changed America forever.", "vids": []}, "grammar": {"std": "L.4.2.b", "topic": "Apostrophes in Contractions", "lesson": "An apostrophe replaces missing letters in a contraction. Examples: do not → don't (apostrophe replaces 'o'), I am → I'm (apostrophe replaces 'a'), they are → they're, it is → it's, would not → wouldn't, could not → couldn't. Be careful not to confuse contractions with possessives! 'It's' = it is. 'Its' = belonging to it. 'They're' = they are. 'Their' = belonging to them.", "exercises": [{"type": "mc", "q": "What is the contraction for 'would not'?", "opts": ["would'nt", "wouldn't", "wouldnt'", "woul'dnt"], "ans": 1}, {"type": "fill", "sentence": "___ important to remember that abolitionists risked their lives for freedom. (It is = contraction)", "ans": "It's", "hint": "It is = It's (apostrophe replaces 'i' in 'is')"}, {"type": "spot", "q": "Click the incorrect use of an apostrophe: 'The abolitionists' courage is a lesson for all of us. They're heroes.'", "words": ["The", "abolitionists'", "courage", "is", "a", "lesson", "for", "all", "of", "us.", "They're", "heroes."], "errorIdx": 0, "errorCorrect": "(all are correct here!)", "explain": "Both apostrophes are correct! 'Abolitionists'' is a plural possessive, and 'They're' is the contraction for 'they are.'"}]}, "write": {"milestone": "Week 2 — Early Life Paragraph", "prompt": "Write a paragraph about your hero's early life. Where and when were they born? What was their childhood like? What challenges did they face early on? Include at least one contraction AND one possessive apostrophe."}, "words": [{"w": "abolitionist", "ph": "ab-oh-LISH-un-ist", "pos": "noun", "def": "A person who fought to end slavery", "ex": "Frederick Douglass was one of the most famous abolitionists."}, {"w": "enslaved", "ph": "en-SLAYVED", "pos": "adjective", "def": "Forced into slavery; held as a slave against one's will", "ex": "Harriet Tubman was an enslaved woman who escaped to freedom."}, {"w": "Underground Railroad", "ph": "UN-der-grownd RAY-lrohd", "pos": "noun", "def": "A secret network of safe houses and paths that helped enslaved people escape to freedom", "ex": "Harriet Tubman guided people north using the Underground Railroad."}, {"w": "abolition", "ph": "ab-oh-LISH-un", "pos": "noun", "def": "The official ending or banning of something, especially slavery", "ex": "The 13th Amendment achieved the abolition of slavery in 1865."}, {"w": "emancipation", "ph": "ih-man-sih-PAY-shun", "pos": "noun", "def": "The act of being set free from slavery or control", "ex": "President Lincoln issued the Emancipation Proclamation in 1863."}, {"w": "fugitive", "ph": "FYOO-jih-tiv", "pos": "noun", "def": "A person who has escaped and is being pursued", "ex": "Escaped enslaved people were considered fugitives under the Fugitive Slave Act."}, {"w": "proclamation", "ph": "prok-luh-MAY-shun", "pos": "noun", "def": "An official public announcement made by a leader", "ex": "Lincoln's Emancipation Proclamation declared enslaved people in rebel states to be free."}, {"w": "persecution", "ph": "per-seh-KYOO-shun", "pos": "noun", "def": "Cruel and unfair treatment of a group of people", "ex": "Enslaved people faced brutal persecution under the slave system."}, {"w": "resistance", "ph": "rih-ZIS-tents", "pos": "noun", "def": "Fighting back against power or control", "ex": "Both Douglass and Tubman showed great resistance against slavery."}, {"w": "refuge", "ph": "REF-yooj", "pos": "noun", "def": "A safe place or shelter from danger", "ex": "Abolitionists provided refuge for people escaping slavery."}], "quiz": [{"q": "What did abolitionists fight for?", "opts": ["Expanding slavery", "Ending slavery", "Women's right to vote", "Independence from Britain"], "ans": 1}, {"q": "What was the Underground Railroad?", "opts": ["A subway system", "A secret network helping enslaved people escape", "A type of train line", "A government program"], "ans": 1}, {"q": "Which abolitionist was born into slavery in Maryland?", "opts": ["Harriet Tubman", "Sojourner Truth", "Frederick Douglass", "Nat Turner"], "ans": 2}, {"q": "What does a contraction do?", "opts": ["Show possession", "Replace missing letters with an apostrophe", "Make a plural noun", "Connect two sentences"], "ans": 1}, {"q": "What is the correct contraction for 'it is'?", "opts": ["its", "its'", "it's", "it'is"], "ans": 2}, {"q": "What does 'emancipation' mean?", "opts": ["Being imprisoned", "Being set free from slavery or control", "Fighting in a war", "Becoming a president"], "ans": 1}, {"q": "What did the 13th Amendment do?", "opts": ["Gave women the right to vote", "Established the three branches", "Abolished slavery", "Created the Bill of Rights"], "ans": 2}, {"q": "What does 'resistance' mean?", "opts": ["Giving up", "Fighting back against power or control", "Hiding from danger", "Asking for help"], "ans": 1}, {"q": "Who issued the Emancipation Proclamation?", "opts": ["George Washington", "Abraham Lincoln", "Frederick Douglass", "Ulysses Grant"], "ans": 1}, {"q": "What does 'refuge' mean?", "opts": ["A dangerous place", "A safe place or shelter from danger", "A type of protest", "A government building"], "ans": 1}]}, {"num": 3, "title": "Civil Rights Leaders", "read": {"title": "The Fight for Equal Rights", "text": "Even after slavery ended in 1865, African Americans faced unfair laws called Jim Crow laws that enforced racial segregation — keeping Black and white Americans separated in schools, restaurants, transportation, and more. The Civil Rights Movement of the 1950s and 60s was a peaceful fight to end segregation and gain equal rights. Dr. Martin Luther King Jr. was its most famous leader. He believed in nonviolent protest and gave his famous 'I Have a Dream' speech in Washington D.C. in 1963. Rosa Parks famously refused to give up her bus seat in 1955. Thurgood Marshall became the first African American Supreme Court Justice in 1967. The Civil Rights Act of 1964 made discrimination illegal.", "vids": [{"label": "Martin Luther King Jr. Biography", "url": "https://www.youtube.com/watch?v=pG8X0vOvi7Q", "note": "MLK Biography — FreeSchool"}]}, "grammar": {"std": "L.4.2.b", "topic": "Plural Possessives", "lesson": "For nouns that are already plural and end in 's,' just add an apostrophe after the s: students' rights, leaders' speeches, workers' rights. For irregular plural nouns (that don't end in 's'), add apostrophe + s: children's rights, men's march, women's movement. Watch out: Don't add an apostrophe to a plain plural! 'The leaders gave speeches' (no apostrophe — leaders is just plural, not possessive).", "exercises": [{"type": "mc", "q": "Which is the correct plural possessive for 'the speeches belonging to the leaders'?", "opts": ["leader's speeches", "leaders speeches", "leaders' speeches", "leaders's speeches"], "ans": 2}, {"type": "fill", "sentence": "The Civil Rights Movement fought for the ___ rights. (rights belonging to all citizens — plural possessive)", "ans": "citizens'", "hint": "Citizens is a plural noun ending in 's' — just add an apostrophe after the s."}, {"type": "spot", "q": "Click the incorrectly used apostrophe: 'The womens' march for equality was a powerful event.'", "words": ["The", "womens'", "march", "for", "equality", "was", "a", "powerful", "event."], "errorIdx": 1, "errorCorrect": "women's", "explain": "'Women' is an irregular plural (not ending in 's'), so the possessive is women's (apostrophe + s), not womens'."}]}, "write": {"milestone": "Week 3 — Important Work Paragraph", "prompt": "Write a paragraph about the most important work your hero did. What did they accomplish? What obstacles did they face? Use at least one plural possessive in your paragraph (e.g., the citizens' rights, the leaders' courage)."}, "words": [{"w": "segregation", "ph": "seg-reh-GAY-shun", "pos": "noun", "def": "The forced separation of people based on race or other characteristics", "ex": "Jim Crow laws enforced racial segregation in the South."}, {"w": "nonviolent", "ph": "non-VY-oh-lent", "pos": "adjective", "def": "Not using physical force or violence to achieve a goal", "ex": "Dr. King believed in nonviolent protest to achieve civil rights."}, {"w": "protest", "ph": "PROH-test", "pos": "noun/verb", "def": "An action or statement expressing disagreement; to express disagreement publicly", "ex": "The Montgomery Bus Boycott was a famous civil rights protest."}, {"w": "boycott", "ph": "BOY-kot", "pos": "noun/verb", "def": "To refuse to use a product or service as a form of protest", "ex": "African Americans boycotted Montgomery buses for 381 days."}, {"w": "discrimination", "ph": "dis-krim-ih-NAY-shun", "pos": "noun", "def": "Unfair treatment of a group based on race, gender, or other characteristics", "ex": "The Civil Rights Act of 1964 made racial discrimination illegal."}, {"w": "equality", "ph": "ih-KWAH-lih-tee", "pos": "noun", "def": "Having the same rights and opportunities as everyone else", "ex": "Dr. King dreamed of a nation where all people lived in equality."}, {"w": "justice", "ph": "JUS-tis", "pos": "noun", "def": "Fair treatment under the law for all people", "ex": "The Civil Rights Movement demanded justice for Black Americans."}, {"w": "legislation", "ph": "lej-ih-SLAY-shun", "pos": "noun", "def": "Laws that have been passed by a government", "ex": "The Civil Rights Act of 1964 was landmark legislation."}, {"w": "movement", "ph": "MOOV-ment", "pos": "noun", "def": "A group of people working together for a social or political cause", "ex": "The Civil Rights Movement changed American society forever."}, {"w": "integration", "ph": "in-teh-GRAY-shun", "pos": "noun", "def": "The process of ending segregation and bringing people together equally", "ex": "School integration meant Black and white children could attend the same schools."}], "quiz": [{"q": "What were Jim Crow laws?", "opts": ["Laws that protected civil rights", "Laws that enforced racial segregation", "Laws passed during the Revolution", "Laws about voting rights"], "ans": 1}, {"q": "What did Dr. King believe in?", "opts": ["Violent revolution", "Nonviolent protest", "Separatism", "Military action"], "ans": 1}, {"q": "What famous speech did Dr. King give in 1963?", "opts": ["Four Score and Seven Years Ago", "Give Me Liberty or Give Me Death", "I Have a Dream", "Ask Not What Your Country Can Do"], "ans": 2}, {"q": "What did Rosa Parks refuse to do?", "opts": ["Attend a segregated school", "Give up her bus seat", "Pay an unfair tax", "Follow a Jim Crow law at a restaurant"], "ans": 1}, {"q": "What does plural possessive for 'leaders' look like?", "opts": ["leader's", "leaders's", "leaders'", "leaders"], "ans": 2}, {"q": "What is the correct possessive for the irregular plural 'women'?", "opts": ["womens'", "women's", "womens", "women'"], "ans": 1}, {"q": "What does 'segregation' mean?", "opts": ["Equal treatment", "Forced separation of people by race", "Integration of schools", "A type of protest"], "ans": 1}, {"q": "What was the Montgomery Bus Boycott?", "opts": ["A celebration", "A march on Washington", "Refusing to ride buses to protest segregation", "A lawsuit against Jim Crow laws"], "ans": 2}, {"q": "What did the Civil Rights Act of 1964 do?", "opts": ["Gave women the right to vote", "Ended slavery", "Made racial discrimination illegal", "Created the Supreme Court"], "ans": 2}, {"q": "Who became the first African American Supreme Court Justice?", "opts": ["Frederick Douglass", "Malcolm X", "Thurgood Marshall", "Barack Obama"], "ans": 2}]}, {"num": 4, "title": "Women's Suffrage", "read": {"title": "The Long Fight to Vote", "text": "For most of American history, women were not allowed to vote. Suffrage means the right to vote. Women who fought for the right to vote were called suffragists. Elizabeth Cady Stanton and Susan B. Anthony were among the first leaders of the women's suffrage movement, which began in the mid-1800s. In 1848, Stanton helped organize the Seneca Falls Convention, the first women's rights meeting in America. Despite decades of peaceful protests, marches, and petitions, it took until 1920 for the 19th Amendment to give women the right to vote. It was a 72-year battle. Today we celebrate Women's Equality Day on August 26 — the day the 19th Amendment was ratified.", "vids": []}, "grammar": {"std": "L.4.1.f", "topic": "Pronoun-Antecedent Agreement", "lesson": "A pronoun must match its antecedent (the noun it replaces) in number (singular/plural) and gender. Singular: he/him/his, she/her/hers, it/its. Plural: they/them/their. Example: 'Susan B. Anthony gave her famous speech.' (she = singular female) 'The suffragists raised their voices.' (they = plural) Common error: 'Everyone raised their hand.' — 'everyone' is singular but 'their' is informal/accepted. Formally: 'Everyone raised his or her hand.'", "exercises": [{"type": "mc", "q": "'Elizabeth Cady Stanton fought her whole life for women's rights.' Is 'her' correct?", "opts": ["No, it should be 'their'", "No, it should be 'its'", "Yes, 'her' agrees with the singular female antecedent 'Elizabeth Cady Stanton'", "No, it should be 'his'"], "ans": 2}, {"type": "fill", "sentence": "The suffragists marched for decades before ___ finally won the right to vote.", "ans": "they", "hint": "'The suffragists' is plural — which plural pronoun replaces them?"}, {"type": "spot", "q": "Click the pronoun that does NOT agree with its antecedent: 'Susan B. Anthony gave their speech at the convention.'", "words": ["Susan", "B.", "Anthony", "gave", "their", "speech", "at", "the", "convention."], "errorIdx": 4, "errorCorrect": "her", "explain": "'Susan B. Anthony' is a singular female noun, so the pronoun should be 'her,' not 'their.'"}]}, "write": {"milestone": "Week 4 — Impact Paragraph", "prompt": "Write a paragraph about the lasting impact of your hero's work. How did their actions change America? How are things different today because of what they did? Use at least two pronouns (he/she/they/them) and make sure they agree with their antecedents."}, "words": [{"w": "suffrage", "ph": "SUF-rij", "pos": "noun", "def": "The right to vote in political elections", "ex": "The 19th Amendment granted women's suffrage in 1920."}, {"w": "suffragist", "ph": "SUF-ruh-jist", "pos": "noun", "def": "A person who campaigns for the right to vote, especially for women", "ex": "Susan B. Anthony was a famous suffragist who spent 50 years fighting for the vote."}, {"w": "convention", "ph": "kun-VEN-shun", "pos": "noun", "def": "A large formal meeting for a specific purpose", "ex": "The Seneca Falls Convention was the first women's rights meeting in America."}, {"w": "amendment", "ph": "uh-MEND-ment", "pos": "noun", "def": "An official change or addition to a law or constitution", "ex": "The 19th Amendment gave women the right to vote."}, {"w": "petition", "ph": "peh-TIH-shun", "pos": "noun", "def": "A formal written request signed by many people", "ex": "Suffragists collected thousands of petition signatures to demand voting rights."}, {"w": "ratify", "ph": "RAT-ih-fy", "pos": "verb", "def": "To officially approve a law or amendment by voting", "ex": "The 19th Amendment was ratified on August 26, 1920."}, {"w": "equality", "ph": "ih-KWAH-lih-tee", "pos": "noun", "def": "The state of having the same rights and opportunities as others", "ex": "The women's suffrage movement fought for political equality."}, {"w": "decade", "ph": "DEK-ayd", "pos": "noun", "def": "A period of ten years", "ex": "Women fought for over seven decades to win the right to vote."}, {"w": "antecedent", "ph": "an-teh-SEE-dent", "pos": "noun", "def": "The noun that a pronoun refers to or replaces", "ex": "In 'Susan gave her speech,' 'Susan' is the antecedent of 'her.'"}, {"w": "pioneer", "ph": "py-oh-NEER", "pos": "noun", "def": "A person who is first to do something or leads the way for others", "ex": "Elizabeth Cady Stanton was a pioneer of the women's rights movement."}], "quiz": [{"q": "What does 'suffrage' mean?", "opts": ["Freedom from slavery", "The right to vote", "Freedom of speech", "The right to a fair trial"], "ans": 1}, {"q": "What amendment gave women the right to vote?", "opts": ["13th", "15th", "17th", "19th"], "ans": 3}, {"q": "When was the 19th Amendment ratified?", "opts": ["1865", "1900", "1920", "1945"], "ans": 2}, {"q": "What was the Seneca Falls Convention?", "opts": ["A Civil War battle", "The first women's rights meeting in America", "A constitutional convention", "A voting day celebration"], "ans": 1}, {"q": "How long did women fight for the right to vote?", "opts": ["10 years", "25 years", "50 years", "72 years"], "ans": 3}, {"q": "A pronoun must agree with its antecedent in:", "opts": ["Color and shape", "Number and gender", "Size and age", "Time and place"], "ans": 1}, {"q": "'The suffragists raised ___ voices.' Which pronoun is correct?", "opts": ["her", "his", "their", "its"], "ans": 2}, {"q": "What is an antecedent?", "opts": ["A type of pronoun", "The noun that a pronoun replaces", "A possessive apostrophe", "A plural noun"], "ans": 1}, {"q": "Who helped organize the Seneca Falls Convention?", "opts": ["Harriet Tubman", "Sojourner Truth", "Elizabeth Cady Stanton", "Rosa Parks"], "ans": 2}, {"q": "What does 'pioneer' mean?", "opts": ["A type of soldier", "A government official", "A person who leads the way for others", "A judge"], "ans": 2}]}, {"num": 5, "title": "Modern Heroes", "read": {"title": "Heroes of the 20th and 21st Centuries", "text": "American heroes didn't stop being born after the 1800s. César Chávez and Dolores Huerta co-founded the United Farm Workers union in the 1960s to fight for better pay and working conditions for farm laborers. Ruth Bader Ginsburg served as a Supreme Court Justice for 27 years and spent her career fighting for gender equality under the law. Neil Armstrong became the first human to walk on the moon on July 20, 1969. Sandra Day O'Connor became the first female Supreme Court Justice in 1981. Barack Obama became the first African American president in 2009. These modern heroes show that the American story is always growing and being written by new people.", "vids": []}, "grammar": {"std": "L.4.1.b", "topic": "Irregular Plural Nouns", "lesson": "Most nouns form the plural by adding -s or -es. But some nouns have irregular plurals — they change spelling or don't change at all! Common irregular plurals: child → children, man → men, woman → women, tooth → teeth, foot → feet, mouse → mice, goose → geese, leaf → leaves, life → lives, person → people. Never add 's to make these plural — never write 'childs' or 'mouses'!", "exercises": [{"type": "mc", "q": "What is the correct plural of 'woman'?", "opts": ["womans", "womens", "woman", "women"], "ans": 3}, {"type": "fill", "sentence": "The lives of these American heroes have inspired millions of ___ around the world. (plural of 'person')", "ans": "people", "hint": "The irregular plural of 'person' is..."}, {"type": "spot", "q": "Click the incorrect plural: 'Many mouses, leafs, and children lived in the forest.'", "words": ["Many", "mouses,", "leafs,", "and", "children", "lived", "in", "the", "forest."], "errorIdx": 1, "errorCorrect": "mice", "explain": "'Mouses' and 'leafs' are both wrong. 'Mouse' → 'mice', and 'leaf' → 'leaves'. 'Children' is correct."}]}, "write": {"milestone": "Week 5 — Conclusion & Final Biography", "prompt": "Write your conclusion paragraph. Why does your hero matter today? What can YOU learn from their life? Then put all 5 paragraphs together into your complete biography. Give it a title: 'A Life That Mattered: [Hero's Name].'"}, "words": [{"w": "labor", "ph": "LAY-ber", "pos": "noun", "def": "Hard work, especially physical work; the workforce", "ex": "César Chávez fought for the rights of farm labor workers."}, {"w": "union", "ph": "YOON-yun", "pos": "noun", "def": "An organization of workers who join together to protect their rights", "ex": "The United Farm Workers union helped improve conditions for laborers."}, {"w": "equality", "ph": "ih-KWAH-lih-tee", "pos": "noun", "def": "Having the same rights, opportunities, and treatment as others", "ex": "Ruth Bader Ginsburg fought for gender equality under the law."}, {"w": "gender", "ph": "JEN-der", "pos": "noun", "def": "The categories of male, female, or other identities a person may have", "ex": "Sandra Day O'Connor broke gender barriers as the first female Supreme Court Justice."}, {"w": "justice", "ph": "JUS-tis", "pos": "noun", "def": "A judge on the Supreme Court; also, fairness under the law", "ex": "Ruth Bader Ginsburg was a Supreme Court Justice for 27 years."}, {"w": "barrier", "ph": "BAIR-ee-er", "pos": "noun", "def": "Something that blocks progress or opportunity", "ex": "Neil Armstrong broke the barrier of space travel by walking on the moon."}, {"w": "astronaut", "ph": "AS-troh-nawt", "pos": "noun", "def": "A person trained to travel in space", "ex": "Neil Armstrong was the first astronaut to walk on the moon."}, {"w": "inspire", "ph": "in-SPY-er", "pos": "verb", "def": "To fill others with courage, creativity, or motivation", "ex": "These modern heroes inspire millions of people around the world."}, {"w": "trailblazer", "ph": "TRAYL-blay-zer", "pos": "noun", "def": "A person who is the first to do something or creates a path for others", "ex": "Sandra Day O'Connor was a trailblazer for women in the legal profession."}, {"w": "legacy", "ph": "LEG-uh-see", "pos": "noun", "def": "The lasting impact a person leaves on the world after they are gone", "ex": "The legacy of these heroes continues to inspire new generations."}], "quiz": [{"q": "Who co-founded the United Farm Workers union?", "opts": ["Martin Luther King Jr. and Rosa Parks", "César Chávez and Dolores Huerta", "Barack Obama and Michelle Obama", "Ruth Bader Ginsburg and Sandra Day O'Connor"], "ans": 1}, {"q": "Who was the first female Supreme Court Justice?", "opts": ["Ruth Bader Ginsburg", "Sonia Sotomayor", "Elena Kagan", "Sandra Day O'Connor"], "ans": 3}, {"q": "When did Neil Armstrong walk on the moon?", "opts": ["1959", "1963", "1969", "1972"], "ans": 2}, {"q": "What is an irregular plural noun?", "opts": ["A noun that adds -s to become plural", "A noun whose plural form changes spelling", "A possessive noun", "A collective noun"], "ans": 1}, {"q": "What is the correct plural of 'child'?", "opts": ["childs", "childes", "children", "child"], "ans": 2}, {"q": "What is the correct plural of 'tooth'?", "opts": ["tooths", "teeth", "tooths", "toothes"], "ans": 1}, {"q": "What is the correct plural of 'leaf'?", "opts": ["leafs", "leafes", "leaves", "leaf"], "ans": 2}, {"q": "Who became the first African American president?", "opts": ["Thurgood Marshall", "Colin Powell", "Barack Obama", "Jesse Jackson"], "ans": 2}, {"q": "What does 'trailblazer' mean?", "opts": ["A type of protest", "A person first to do something or create a path for others", "A Supreme Court justice", "A labor union leader"], "ans": 1}, {"q": "What does 'legacy' mean?", "opts": ["A type of law", "A government position", "The lasting impact a person leaves on the world", "A historical document"], "ans": 2}]}]}, {"id": 6, "title": "American Culture & Arts", "sub": "Music, Food, and Traditions", "color": "#e53e8a", "icon": "🎨", "book": null, "writing_project": {"title": "Cultural Celebration Guide", "desc": "Write a guide to an American cultural celebration or tradition. Each week you'll add one section to your guide."}, "weeks": [{"num": 1, "title": "Native American Traditions", "read": {"title": "The First Americans", "text": "Long before European settlers arrived, hundreds of Native American nations lived throughout North America. Each nation had its own language, culture, traditions, and government. The Cherokee, Navajo, Lakota Sioux, Iroquois, and Apache are just a few of the hundreds of nations that existed. Native Americans had deep connections to the land and nature. They developed complex societies with farming, trade networks, art, and oral traditions — stories passed down by speaking rather than writing. Today, there are 574 federally recognized Native American tribes in the United States. Native American cultures have contributed enormous amounts to American food, place names, and even government structure.", "vids": []}, "grammar": {"std": "L.4.2.d", "topic": "Spelling: Silent Letters", "lesson": "Some English words have silent letters — letters that are written but not pronounced. Common silent letter patterns: silent K before N (knife, know, knight), silent W before R (write, wrong, wrap), silent B after M (lamb, comb, thumb), silent G before N (sign, gnaw, gnat), silent H in some words (honest, hour, heir). Knowing these patterns helps you spell correctly!", "exercises": [{"type": "mc", "q": "Which word has a silent 'k'?", "opts": ["kite", "keep", "knight", "kitchen"], "ans": 2}, {"type": "fill", "sentence": "She used a ___ to cut the fruit. (a tool with a blade — contains silent k)", "ans": "knife", "hint": "This cutting tool starts with 'kn' — the k is silent!"}, {"type": "spot", "q": "Click the word with a silent letter in: 'The Native American chief signed his name on the document.'", "words": ["The", "Native", "American", "chief", "signed", "his", "name", "on", "the", "document."], "errorIdx": 4, "errorCorrect": "signed (silent g)", "explain": "In 'signed,' the 'g' is silent — you say 'synd' not 'sig-ned.' The pattern gn often has a silent g."}]}, "write": {"milestone": "Week 1 — Choose Celebration & Introduction", "prompt": "Choose an American cultural celebration or tradition for your guide. (Ideas: Thanksgiving, Juneteenth, Lunar New Year celebrations in America, Día de los Muertos, Powwow.) Write an introduction: What is this celebration? Who observes it? When does it happen?"}, "words": [{"w": "nation", "ph": "NAY-shun", "pos": "noun", "def": "A large community of people sharing territory, culture, and government; also a Native American tribe", "ex": "The Cherokee Nation is one of the largest Native American nations."}, {"w": "oral tradition", "ph": "OR-ul truh-DIH-shun", "pos": "noun", "def": "The practice of passing stories, history, and knowledge by speaking rather than writing", "ex": "Many Native American nations preserved their history through oral tradition."}, {"w": "indigenous", "ph": "in-DIJ-uh-nus", "pos": "adjective", "def": "Originally living in or from a place; native to an area", "ex": "Native Americans are the indigenous people of North America."}, {"w": "treaty", "ph": "TREE-tee", "pos": "noun", "def": "A formal agreement between two nations or groups", "ex": "Many treaties between the U.S. government and Native American nations were broken."}, {"w": "reservation", "ph": "rez-er-VAY-shun", "pos": "noun", "def": "Land set aside by the government for Native American tribes to live on", "ex": "Many Native American families live on reservations today."}, {"w": "sovereignty", "ph": "SOV-er-en-tee", "pos": "noun", "def": "The right of a group to govern itself independently", "ex": "Native American nations have a degree of sovereignty within U.S. borders."}, {"w": "heritage", "ph": "HAIR-ih-tij", "pos": "noun", "def": "Traditions and culture passed down through generations", "ex": "Powwows celebrate Native American heritage through dance, music, and art."}, {"w": "diverse", "ph": "dih-VERS", "pos": "adjective", "def": "Varied; made up of many different types", "ex": "Native American cultures are incredibly diverse across the continent."}, {"w": "contribute", "ph": "kun-TRIB-yoot", "pos": "verb", "def": "To give or add something of value", "ex": "Native Americans contributed many foods — like corn, potatoes, and tomatoes — to the world."}, {"w": "powwow", "ph": "POW-wow", "pos": "noun", "def": "A Native American gathering featuring dance, music, food, and cultural celebration", "ex": "The annual powwow brought together members of many different tribal nations."}], "quiz": [{"q": "How many federally recognized Native American tribes are in the U.S. today?", "opts": ["100", "250", "574", "1000"], "ans": 2}, {"q": "What is an oral tradition?", "opts": ["Writing history in books", "Passing stories by speaking, not writing", "A type of artwork", "A musical tradition"], "ans": 1}, {"q": "What does 'indigenous' mean?", "opts": ["Recently arrived", "Originally from a place", "Living in a city", "Part of the government"], "ans": 1}, {"q": "Which word has a silent letter 'k'?", "opts": ["keep", "kite", "knife", "key"], "ans": 2}, {"q": "What is a silent letter?", "opts": ["A letter not in the alphabet", "A letter written but not pronounced", "A letter always at the end of a word", "A letter that changes pronunciation"], "ans": 1}, {"q": "What is a powwow?", "opts": ["A type of treaty", "A Native American gathering of dance, music, and culture", "A government building", "A type of reservation school"], "ans": 1}, {"q": "What is a reservation?", "opts": ["A restaurant booking", "Land set aside by the government for Native American tribes", "A type of treaty", "A national park"], "ans": 1}, {"q": "What does 'sovereignty' mean?", "opts": ["Being part of a larger government", "The right of a group to govern itself", "A type of law", "A national symbol"], "ans": 1}, {"q": "Which food was NOT contributed by Native Americans?", "opts": ["Corn", "Potatoes", "Wheat", "Tomatoes"], "ans": 2}, {"q": "What is a treaty?", "opts": ["A type of artwork", "A formal agreement between two nations", "A government law", "A cultural tradition"], "ans": 1}]}, {"num": 2, "title": "Immigration & Diversity", "read": {"title": "A Nation of Immigrants", "text": "The United States has often been called a 'nation of immigrants' because, except for Native Americans, everyone in America either came from another country or is descended from people who did. Millions of immigrants came through Ellis Island in New York Harbor between 1892 and 1954. They came from Ireland, Italy, Poland, Russia, China, Japan, Mexico, and countries all around the world. Immigrants brought their languages, food, music, and traditions — and these combined to create the unique, diverse culture of America. Today the United States continues to welcome immigrants. About 14% of the U.S. population is foreign-born. America's diversity is one of its greatest strengths.", "vids": []}, "grammar": {"std": "L.4.1.a", "topic": "Abstract vs. Concrete Nouns", "lesson": "A concrete noun names something you can see, touch, hear, smell, or taste: flag, music, food, river. An abstract noun names an idea, feeling, or quality that you cannot physically sense: freedom, courage, justice, diversity, hope, culture, identity. Both types of nouns are important in writing! Abstract nouns often need concrete examples to help readers understand them.", "exercises": [{"type": "mc", "q": "Which is an abstract noun?", "opts": ["flag", "Ellis Island", "immigrant", "freedom"], "ans": 3}, {"type": "fill", "sentence": "America's ___ means people of many different backgrounds live and work together. (an abstract noun about variety)", "ans": "diversity", "hint": "This abstract noun describes being made up of many different types of people."}, {"type": "spot", "q": "Click the CONCRETE noun in: 'The immigrants carried their hopes and their suitcases off the ship.'", "words": ["The", "immigrants", "carried", "their", "hopes", "and", "their", "suitcases", "off", "the", "ship."], "errorIdx": 7, "errorCorrect": "suitcases", "explain": "'Suitcases' is a concrete noun — you can see and touch them. 'Hopes' is an abstract noun — it's an idea or feeling you cannot physically hold."}]}, "write": {"milestone": "Week 2 — History & Origins", "prompt": "Write a section of your guide about the history and origins of your chosen celebration. When did it start? Who started it and why? How has it changed over time? Include at least one abstract noun (like freedom, hope, unity, or pride)."}, "words": [{"w": "immigrant", "ph": "IM-ih-grunt", "pos": "noun", "def": "A person who moves to a new country to live there permanently", "ex": "Millions of immigrants came to America through Ellis Island."}, {"w": "descended", "ph": "deh-SEND-ed", "pos": "verb", "def": "Having ancestors from a particular place or family", "ex": "Most Americans are descended from people who came from other countries."}, {"w": "diversity", "ph": "dih-VER-sih-tee", "pos": "noun", "def": "A variety of different people, cultures, or ideas in one place", "ex": "America's diversity makes it a rich and vibrant country."}, {"w": "assimilate", "ph": "uh-SIM-ih-layt", "pos": "verb", "def": "To absorb and become part of a new culture or society", "ex": "Many immigrants assimilated into American culture while keeping their own traditions."}, {"w": "ancestor", "ph": "AN-ses-ter", "pos": "noun", "def": "A family member who lived long ago", "ex": "My ancestors came from Ireland in the 1840s."}, {"w": "culture", "ph": "KUL-cher", "pos": "noun", "def": "The shared traditions, food, language, and way of life of a group", "ex": "Immigrants brought their home cultures to America and enriched it."}, {"w": "melting pot", "ph": "MEL-ting POT", "pos": "noun", "def": "A metaphor for a place where many cultures blend together", "ex": "America is often called a melting pot of cultures."}, {"w": "citizenship", "ph": "SIT-ih-zen-ship", "pos": "noun", "def": "The status of being a citizen with full legal rights in a country", "ex": "Immigrants can apply for U.S. citizenship after living here for several years."}, {"w": "naturalization", "ph": "nach-er-ul-ih-ZAY-shun", "pos": "noun", "def": "The legal process by which an immigrant becomes a citizen", "ex": "The naturalization ceremony is an important milestone for new citizens."}, {"w": "abstract", "ph": "AB-strakt", "pos": "adjective", "def": "Existing as an idea or concept, not as a physical thing", "ex": "Freedom and justice are abstract concepts protected by the Constitution."}], "quiz": [{"q": "Where did many immigrants enter the U.S. between 1892 and 1954?", "opts": ["The Statue of Liberty", "Ellis Island", "The Golden Gate Bridge", "Boston Harbor"], "ans": 1}, {"q": "What percentage of the U.S. population is foreign-born today?", "opts": ["2%", "5%", "14%", "30%"], "ans": 2}, {"q": "What is a concrete noun?", "opts": ["An idea or feeling", "Something you can physically sense", "A describing word", "A connecting word"], "ans": 1}, {"q": "Which is an abstract noun?", "opts": ["suitcase", "ship", "Ellis Island", "courage"], "ans": 3}, {"q": "What does 'diversity' mean?", "opts": ["Being the same", "A variety of different people and cultures in one place", "A government document", "A type of tradition"], "ans": 1}, {"q": "What does 'assimilate' mean?", "opts": ["To leave a country", "To become part of a new culture", "To start a new tradition", "To resist change"], "ans": 1}, {"q": "What does 'naturalization' refer to?", "opts": ["Learning a new language", "The process of an immigrant becoming a citizen", "Moving to a new country", "Getting a passport"], "ans": 1}, {"q": "Why is America called 'a nation of immigrants'?", "opts": ["Only immigrants can be citizens", "Almost everyone is from or descended from people of other countries", "It has the most immigrants in the world", "Immigrants created all American laws"], "ans": 1}, {"q": "What is a 'melting pot'?", "opts": ["A type of cooking vessel", "A metaphor for a place where cultures blend together", "A type of immigration law", "A government program"], "ans": 1}, {"q": "What does 'ancestor' mean?", "opts": ["A future descendant", "A government official", "A family member who lived long ago", "A cultural tradition"], "ans": 2}]}, {"num": 3, "title": "American Music & Art", "read": {"title": "The Sounds and Sights of America", "text": "American music is known around the world. Jazz was born in New Orleans in the early 1900s, blending African rhythms with European instruments. Louis Armstrong and Duke Ellington became world-famous jazz musicians. The blues developed in the Mississippi Delta, expressing the pain and resilience of African American communities. Rock and roll grew out of the blues in the 1950s, with artists like Chuck Berry. Country music came from the folk traditions of the rural South and Appalachia. Hip-hop was born in New York City in the 1970s. American visual art includes the Hudson River School paintings of the 1800s, Andy Warhol's pop art, and the murals of Diego Rivera. America's artistic tradition is as diverse as its people.", "vids": [{"label": "All About Jazz for Kids", "url": "https://www.youtube.com/watch?v=YNVLyl8eWoA", "note": "Jazz for Kids"}]}, "grammar": {"std": "L.4.5.b", "topic": "Idioms, Adages, and Proverbs", "lesson": "An idiom is a phrase whose meaning is different from the literal words. 'Break a leg' doesn't mean actually break your leg — it means 'good luck'! An adage is a well-known saying that expresses a truth: 'Actions speak louder than words.' A proverb is similar: 'Don't judge a book by its cover.' These sayings add color and wisdom to writing. Look for these in books, songs, and speeches!", "exercises": [{"type": "mc", "q": "What does the idiom 'hit the right note' most likely mean?", "opts": ["To play music perfectly", "To do or say exactly the right thing", "To punch a musical note", "To sing very loudly"], "ans": 1}, {"type": "fill", "sentence": "The adage '___ speaks louder than words' means what you DO matters more than what you SAY.", "ans": "Actions", "hint": "Complete this famous adage about doing vs. saying."}, {"type": "spot", "q": "Click the idiom in: 'Louis Armstrong really hit it out of the park with his trumpet performances.'", "words": ["Louis", "Armstrong", "really", "hit", "it", "out", "of", "the", "park", "with", "his", "trumpet", "performances."], "errorIdx": 3, "errorCorrect": "hit it out of the park", "explain": "'Hit it out of the park' is an idiom meaning 'to do something extremely well.' It doesn't mean hitting a baseball!"}]}, "write": {"milestone": "Week 3 — How to Celebrate", "prompt": "Write the main section of your guide: How do people celebrate this event? What do they do, eat, wear, and sing? Describe the experience vividly. Include at least one idiom or well-known saying that fits your celebration."}, "words": [{"w": "rhythm", "ph": "RITH-um", "pos": "noun", "def": "A strong, regular repeated pattern of sound in music", "ex": "Jazz has a lively rhythm that makes people want to dance."}, {"w": "resilience", "ph": "rih-ZIL-ee-ents", "pos": "noun", "def": "The ability to recover from difficulty; toughness", "ex": "The blues expressed the resilience of African American communities."}, {"w": "improvisation", "ph": "im-prov-ih-ZAY-shun", "pos": "noun", "def": "Creating music, art, or performance on the spot without planning", "ex": "Improvisation is a key feature of jazz music."}, {"w": "mural", "ph": "MYOOR-ul", "pos": "noun", "def": "A large painting made directly on a wall", "ex": "Colorful murals tell the stories of local communities in many American cities."}, {"w": "genre", "ph": "ZHAHN-ruh", "pos": "noun", "def": "A category or type of art, music, or writing", "ex": "Jazz, blues, and hip-hop are all genres of American music."}, {"w": "idiom", "ph": "ID-ee-um", "pos": "noun", "def": "A phrase whose meaning is different from the literal words", "ex": "'Break a leg' is an idiom that means 'good luck.'"}, {"w": "adage", "ph": "AD-ij", "pos": "noun", "def": "A well-known saying that expresses a general truth", "ex": "'Actions speak louder than words' is a famous adage."}, {"w": "proverb", "ph": "PROV-erb", "pos": "noun", "def": "A short, well-known saying of wisdom or truth", "ex": "'Don't judge a book by its cover' is a proverb about not making quick judgments."}, {"w": "heritage", "ph": "HAIR-ih-tij", "pos": "noun", "def": "Cultural traditions and practices passed down through generations", "ex": "Jazz is an important part of America's musical heritage."}, {"w": "harmony", "ph": "HAR-moh-nee", "pos": "noun", "def": "The combination of different musical notes played together; also, peaceful agreement", "ex": "The choir sang in beautiful harmony at the Fourth of July concert."}], "quiz": [{"q": "Where was jazz born?", "opts": ["New York City", "Chicago", "New Orleans", "Memphis"], "ans": 2}, {"q": "Where did hip-hop originate?", "opts": ["Los Angeles", "New Orleans", "Chicago", "New York City"], "ans": 3}, {"q": "What is an idiom?", "opts": ["A type of musical instrument", "A phrase whose meaning differs from the literal words", "A well-known proverb", "A type of painting style"], "ans": 1}, {"q": "What does 'break a leg' mean?", "opts": ["To actually break a bone", "Bad luck", "Good luck", "To dance well"], "ans": 2}, {"q": "What is an adage?", "opts": ["A type of idiom", "A well-known saying expressing a truth", "A style of painting", "A type of folk music"], "ans": 1}, {"q": "What is improvisation in music?", "opts": ["Reading music from a sheet", "Creating music on the spot without planning", "Practicing the same song repeatedly", "Playing classical music"], "ans": 1}, {"q": "Where did the blues originate?", "opts": ["The Appalachian Mountains", "New England", "The Mississippi Delta", "The Pacific Northwest"], "ans": 2}, {"q": "What is a mural?", "opts": ["A type of sculpture", "A large painting on a wall", "A style of music", "A type of dance"], "ans": 1}, {"q": "What does 'hit it out of the park' mean?", "opts": ["To play baseball", "To do something extremely well", "To perform on a stage", "To travel far away"], "ans": 1}, {"q": "What is a genre?", "opts": ["A type of instrument", "A category or type of art, music, or writing", "A famous musician", "A musical instrument"], "ans": 1}]}, {"num": 4, "title": "Holidays & Celebrations", "read": {"title": "American Holidays Throughout the Year", "text": "Americans celebrate many holidays throughout the year, each with its own history and traditions. Independence Day on July 4 celebrates the signing of the Declaration of Independence in 1776, with fireworks, parades, and barbecues. Thanksgiving, celebrated on the fourth Thursday of November, is a time for families to gather and give thanks. Martin Luther King Jr. Day in January honors the civil rights leader. Veterans Day on November 11 honors all who served in the military. Memorial Day on the last Monday of May honors those who died in service. Juneteenth on June 19 became a federal holiday in 2021, celebrating the end of slavery in the United States. Each holiday is a story about American history and values.", "vids": []}, "grammar": {"std": "L.4.5.a", "topic": "Metaphors", "lesson": "A metaphor says one thing IS another — it doesn't use 'like' or 'as.' It makes a direct comparison. Examples: 'America is a tapestry of cultures.' (America is not literally a tapestry, but the comparison shows how different cultures weave together.) 'Independence Day is a birthday party for the nation.' 'Life is a journey.' Metaphors create a vivid picture without the words 'like' or 'as.'", "exercises": [{"type": "mc", "q": "Which sentence contains a metaphor (not a simile)?", "opts": ["The fireworks were like stars exploding.", "The fireworks were as bright as the sun.", "The Fourth of July is America's birthday.", "The parade moved like a colorful river."], "ans": 2}, {"type": "fill", "sentence": "Juneteenth is a ___ of freedom — the day liberation finally reached all enslaved Americans.", "ans": "beacon", "hint": "What word means a guiding light or symbol of hope? (not like/as — a direct metaphor)"}, {"type": "spot", "q": "Click the metaphor in: 'The holiday feast was an ocean of flavors from every culture.'", "words": ["The", "holiday", "feast", "was", "an", "ocean", "of", "flavors", "from", "every", "culture."], "errorIdx": 4, "errorCorrect": "ocean (metaphor)", "explain": "'An ocean of flavors' is a metaphor — the feast isn't literally an ocean, but comparing it shows the enormous variety of tastes."}]}, "write": {"milestone": "Week 4 — Why It Matters", "prompt": "Write a paragraph about why your chosen celebration is important to American culture and identity. Include at least ONE metaphor — compare something about your celebration to something else without using 'like' or 'as.'"}, "words": [{"w": "commemorate", "ph": "kuh-MEM-oh-rayt", "pos": "verb", "def": "To honor and remember an important event or person", "ex": "Memorial Day commemorates soldiers who died for their country."}, {"w": "federal holiday", "ph": "FED-er-ul HOL-ih-day", "pos": "noun", "def": "A holiday officially recognized by the national government", "ex": "Juneteenth became a federal holiday in 2021."}, {"w": "Juneteenth", "ph": "JOON-teenth", "pos": "noun", "def": "A holiday on June 19 celebrating the end of slavery in the United States", "ex": "Juneteenth marks the day in 1865 when enslaved people in Texas learned they were free."}, {"w": "tradition", "ph": "truh-DIH-shun", "pos": "noun", "def": "A custom or activity practiced regularly by a group", "ex": "Watching fireworks is an American Fourth of July tradition."}, {"w": "metaphor", "ph": "MET-uh-for", "pos": "noun", "def": "A comparison that says one thing IS another, without using 'like' or 'as'", "ex": "'America is a tapestry of cultures' is a metaphor."}, {"w": "liberation", "ph": "lib-er-AY-shun", "pos": "noun", "def": "The act of being set free from oppression or slavery", "ex": "Juneteenth celebrates the liberation of the last enslaved Americans."}, {"w": "ceremony", "ph": "SAIR-eh-moh-nee", "pos": "noun", "def": "A formal event held to honor or celebrate something", "ex": "The Veterans Day ceremony included a military parade and the playing of Taps."}, {"w": "gratitude", "ph": "GRAT-ih-tood", "pos": "noun", "def": "The feeling of being thankful and appreciative", "ex": "Thanksgiving is a time for gratitude and spending time with family."}, {"w": "unity", "ph": "YOO-nih-tee", "pos": "noun", "def": "Being joined together as one; togetherness", "ex": "National holidays create a sense of unity among all Americans."}, {"w": "tapestry", "ph": "TAP-es-tree", "pos": "noun", "def": "A woven cloth with a picture; also a metaphor for something made of many parts", "ex": "America's culture is a rich tapestry of traditions from around the world."}], "quiz": [{"q": "When is Independence Day?", "opts let curUnit=0,curWeek=0;
const progress=JSON.parse(localStorage.getItem('joey_progress')||'{}');
const writings=JSON.parse(localStorage.getItem('joey_writings')||'{}');
const grammarState=JSON.parse(localStorage.getItem('joey_grammar')||'{}');
const quizState=JSON.parse(localStorage.getItem('joey_quiz')||'{}');

function save(){
  localStorage.setItem('joey_progress',JSON.stringify(progress));
  localStorage.setItem('joey_writings',JSON.stringify(writings));
  localStorage.setItem('joey_grammar',JSON.stringify(grammarState));
  localStorage.setItem('joey_quiz',JSON.stringify(quizState));
  updateProgressBar();
}

function updateProgressBar(){
  let done=0;
  UNITS.forEach(u=>u.weeks.forEach(w=>{
    const k=`u${u.id}w${w.num}`;
    if(progress[k]&&progress[k].complete) done++;
  }));
  document.getElementById('prog-fill').style.width=(done/30*100)+'%';
}

// ── VIEWS ──
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function showHome(){
  renderHome();
  showView('view-home');
}

function showUnit(uid){
  if(uid!==undefined) curUnit=uid;
  renderUnit();
  showView('view-unit');
}

function showWeek(uid,wnum){
  if(uid!==undefined) curUnit=uid;
  if(wnum!==undefined) curWeek=wnum;
  renderWeek();
  showView('view-week');
}

// ── HOME ──
function renderHome(){
  const g=document.getElementById('units-grid');
  g.innerHTML=UNITS.map(u=>{
    const done=u.weeks.filter(w=>progress[`u${u.id}w${w.num}`]?.complete).length;
    const dots=u.weeks.map(w=>`<div class="dot${progress['u'+u.id+'w'+w.num]?.complete?' done':''}"></div>`).join('');
    return `<div class="unit-card" style="border-top-color:${u.color}" onclick="showUnit(${u.id-1})">
      <div class="unit-icon">${u.icon}</div>
      <div class="unit-title">${u.title}</div>
      <div class="unit-sub">${u.sub}</div>
      <div class="unit-progress">${done}/${u.weeks.length} weeks complete</div>
      <div class="progress-dots">${dots}</div>
    </div>`;
  }).join('');
  updateProgressBar();
}

// ── UNIT ──
function renderUnit(){
  const u=UNITS[curUnit];
  document.getElementById('bc-unit').textContent=u.title;
  const h=document.getElementById('unit-header');
  h.style.borderLeftColor=u.color;
  h.innerHTML=`<div class="icon">${u.icon}</div>
    <div>
      <div style="font-size:.75rem;font-weight:700;color:#718096;text-transform:uppercase">Unit ${u.id}</div>
      <div style="font-size:1.2rem;font-weight:800;color:#1a202c">${u.title}</div>
      <div style="font-size:.9rem;color:#718096">${u.sub}</div>
      ${u.book?`<div style="margin-top:6px;font-size:.85rem;color:#e07b39">📖 Book: <em>${u.book.title}</em> — ${u.book.note}</div>`:''}
      <div style="margin-top:6px;font-size:.85rem;color:#6b46c1">✍ Writing Project: <em>${u.writing_project.title}</em></div>
    </div>`;
  const g=document.getElementById('weeks-grid');
  g.innerHTML=u.weeks.map(w=>{
    const k=`u${u.id}w${w.num}`;
    const done=progress[k]?.complete;
    return `<div class="week-card${done?' completed':''}" onclick="showWeek(${curUnit},${w.num-1})">
      <div class="week-num">Week ${w.num} ${done?'<span class="week-checkmark">✓</span>':''}</div>
      <div class="week-title">${w.title}</div>
      <div style="font-size:.75rem;color:#718096;margin-top:6px">${w.grammar.std} · ${w.grammar.topic.split(':')[0]}</div>
    </div>`;
  }).join('');
}

// ── WEEK ──
function renderWeek(){
  const u=UNITS[curUnit];
  const w=u.weeks[curWeek];
  const k=`u${u.id}w${w.num}`;
  document.getElementById('bc-unit2').textContent=u.title;
  document.getElementById('bc-week').textContent=`Week ${w.num}: ${w.title}`;
  const h=document.getElementById('week-header');
  h.innerHTML=`<div style="font-size:2rem">${u.icon}</div>
    <div>
      <div style="font-size:.75rem;font-weight:700;color:#718096;text-transform:uppercase">${u.title} · Week ${w.num}</div>
      <div style="font-size:1.15rem;font-weight:800;color:#1a202c">${w.title}</div>
      <div style="font-size:.85rem;color:#6b46c1;margin-top:4px">✍ ${w.write.milestone}</div>
    </div>
    <div style="margin-left:auto">
      <button onclick="markComplete('${k}')" style="padding:8px 16px;background:${progress[k]?.complete?'#68d391':'#2b6cb0'};color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem">
        ${progress[k]?.complete?'✓ Complete':'Mark Complete'}
      </button>
    </div>`;

  const hasBQ=!!w.book_quiz;
  const tabNames=['📖 Read','📝 Grammar','✍ Write','💬 Words','❓ Quiz'+(hasBQ?' (10)':'')];
  if(hasBQ) tabNames.push('📚 Book Quiz');
  
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=tabNames.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" onclick="switchTab(${i})">${t}</button>`).join('');
  
  const tc=document.getElementById('tab-contents');
  tc.innerHTML=[
    renderRead(w),
    renderGrammar(u,w,k),
    renderWrite(u,w,k),
    renderWords(w),
    renderQuiz(u,w,k,false),
    ...(hasBQ?[renderBookQuiz(u,w,k)]:[])
  ].map((html,i)=>`<div class="tab-content${i===0?' active':''}" id="tc-${i}">${html}</div>`).join('');
}

function switchTab(i){
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',i===j));
  document.querySelectorAll('.tab-content').forEach((c,j)=>c.classList.toggle('active',i===j));
}

function markComplete(k){
  if(!progress[k]) progress[k]={};
  progress[k].complete=true;
  save();
  renderWeek();
  renderUnit();
}

// ── READ ──
function renderRead(w){
  const vids=w.read.vids&&w.read.vids.length?
    `<div class="vid-list">${w.read.vids.map(v=>`<a class="vid-link" href="${v.url}" target="_blank" rel="noopener">▶ ${v.label}<span class="vid-note">${v.note}</span></a>`).join('')}</div>`:'';
  return `<div class="reading-card">
    <h3>📖 ${w.read.title}</h3>
    <p class="reading-text">${w.read.text}</p>
    ${vids}
  </div>`;
}

// ── GRAMMAR ──
function renderGrammar(u,w,k){
  const gk=k+'_g';
  const state=grammarState[gk]||{};
  let html=`<div class="grammar-card">
    <div class="std-tag">${w.grammar.std}</div>
    <h3>${w.grammar.topic}</h3>
    <div class="lesson-box">${w.grammar.lesson}</div>`;
  w.grammar.exercises.forEach((ex,ei)=>{
    const es=state[ei]||{};
    html+=`<div class="exercise" id="ex_${ei}">`;
    html+=`<p>${ei+1}. ${ex.q||ex.sentence||'Exercise '+(ei+1)}</p>`;
    if(ex.type==='mc'){
      html+=`<div class="mc-opts">`;
      ex.opts.forEach((opt,oi)=>{
        const cls=es.done?(oi===ex.ans?'correct':(oi===es.chosen?'wrong':'')):'';
        html+=`<button class="mc-opt ${cls}" ${es.done?'disabled':''} onclick="checkMC('${gk}',${ei},${oi},${ex.ans})">${opt}</button>`;
      });
      html+=`</div>`;
      if(es.done) html+=`<div class="explain-box" style="display:block">✅ ${es.correct?'Correct!':'Incorrect.'} ${ex.opts[ex.ans]} is the right answer.</div>`;
    } else if(ex.type==='fill'){
      const ok=es.done&&es.correct;
      const err=es.done&&!es.correct;
      const fillCls='fill-in'+(ok?' ok':err?' err':'');
      const fillVal=ok?ex.ans:(err?es.val:'');
      html+=`<div class="fill-row">
        <span style="font-size:.95rem;color:#2d3748">${ex.sentence.replace('___','<input class="'+fillCls+'" id="fill_'+ei+'" placeholder="type here" value="'+fillVal+'" '+(ok?'disabled':'')+'>').replace(/"/g,'"')}</span>
        ${!ok?`<button class="check-btn" onclick="checkFill('${gk}',${ei})">Check</button>`:''}
      </div>
      <div class="fill-hint">💡 ${ex.hint}</div>`;
      if(es.done) html+=`<div class="explain-box" style="display:block">${es.correct?'✅ Correct!':'❌ The answer is: <strong>'+ex.ans+'</strong>'}</div>`;
    } else if(ex.type==='spot'){
      html+=`<div class="spot-words">`;
      ex.words.forEach((word,wi)=>{
        const cls=es.done?(wi===ex.errorIdx?'correct-click':(es.clicked===wi?'wrong-click':'')):'';
        html+=`<div class="spot-word ${cls}" onclick="checkSpot('${gk}',${ei},${wi},${ex.errorIdx})">${word}</div>`;
      });
      html+=`</div>`;
      if(es.done) html+=`<div class="explain-box" style="display:block">💡 ${ex.explain}</div>`;
    }
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

function checkMC(gk,ei,chosen,ans){
  if(!grammarState[gk]) grammarState[gk]={};
  grammarState[gk][ei]={done:true,correct:chosen===ans,chosen};
  save(); refreshGrammar();
}

function checkFill(gk,ei){
  const inp=document.getElementById('fill_'+ei);
  const u=UNITS[curUnit],w=u.weeks[curWeek];
  const ex=w.grammar.exercises[ei];
  const val=inp.value.trim();
  const correct=val.toLowerCase()===ex.ans.toLowerCase();
  if(!grammarState[gk]) grammarState[gk]={};
  grammarState[gk][ei]={done:true,correct,val};
  save(); refreshGrammar();
}

function checkSpot(gk,ei,wi,errorIdx){
  if(!grammarState[gk]) grammarState[gk]={};
  if(grammarState[gk][ei]?.done) return;
  grammarState[gk][ei]={done:true,correct:wi===errorIdx,clicked:wi};
  save(); refreshGrammar();
}

function refreshGrammar(){
  const u=UNITS[curUnit],w=u.weeks[curWeek];
  const k=`u${u.id}w${w.num}`;
  const tc=document.getElementById('tc-1');
  if(tc) tc.innerHTML=renderGrammar(u,w,k);
}

// ── WRITE ──
function renderWrite(u,w,k){
  const wk=k+'_w';
  const saved=writings[wk]||'';
  const fb=writings[wk+'_fb']||'';
  return `<div class="write-card">
    <div class="std-tag">W.4.2 / W.4.5</div>
    <h3>✍ ${w.write.milestone}</h3>
    <div style="font-size:.85rem;color:#6b46c1;margin-bottom:10px">📘 Project: ${u.writing_project.title}</div>
    <div class="write-prompt">${w.write.prompt}</div>
    <textarea class="write-area" id="write_${k}" placeholder="Write your response here...">${saved}</textarea>
    <div class="write-controls">
      <button class="save-btn" onclick="saveWrite('${k}')">💾 Save</button>
      <button class="ai-btn" onclick="getAIFeedback('${k}')">🤖 Get AI Feedback</button>
    </div>
    <div class="saved-note" id="saved_${k}"></div>
    ${fb?`<div class="ai-feedback">${fb}</div>`:'<div class="ai-feedback" id="aifb_${k}" style="display:none"></div>'}
  </div>`;
}

function saveWrite(k){
  const ta=document.getElementById('write_'+k);
  if(!ta) return;
  writings[k]=ta.value;
  save();
  const note=document.getElementById('saved_'+k);
  if(note){note.textContent='✓ Saved!';setTimeout(()=>note.textContent='',2000);}
}

async function getAIFeedback(k){
  const ta=document.getElementById('write_'+k);
  if(!ta||!ta.value.trim()){alert('Please write something first!');return;}
  const apiKey=localStorage.getItem('joey_api_key');
  if(!apiKey){alert('Please add your Claude API key in Settings first.');return;}
  const u=UNITS[curUnit],w=u.weeks[curWeek];
  const prompt=`You are a warm, encouraging writing teacher for a bilingual 9-year-old student (English/Chinese). The student wrote the following response to this prompt:\n\nPrompt: "${w.write.prompt}"\n\nStudent's writing:\n"${ta.value}"\n\nPlease give:\n1. Two specific things they did WELL (be enthusiastic and specific)\n2. One clear, simple suggestion to make it even better\n3. One encouraging closing sentence\n\nKeep your response friendly, simple, and under 200 words. Do NOT use bullet points — write in a warm, conversational way.`;
  const fbDiv=document.getElementById('aifb_'+k)||document.querySelector('.ai-feedback');
  if(fbDiv){fbDiv.style.display='block';fbDiv.textContent='🤖 Getting feedback...';}
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:400,messages:[{role:'user',content:prompt}]})
    });
    const d=await r.json();
    const text=d.content?.[0]?.text||'Could not get feedback.';
    if(fbDiv) fbDiv.textContent=text;
    writings[k+'_fb']=text;
    save();
  } catch(e){
    if(fbDiv) fbDiv.textContent='Error: '+e.message;
  }
}

// ── WORDS ──
function renderWords(w){
  return `<div class="words-grid">${w.words.map((v,i)=>`
    <div class="word-card">
      <div class="word-top">
        <div>
          <div class="word-w">${v.w}</div>
          <div class="word-ph">${v.ph}</div>
        </div>
        <button class="speak-btn" onclick="speak('${v.w.replace(/'/g,"\\'")}')">🔊</button>
      </div>
      <div class="word-pos">${v.pos}</div>
      <div class="word-def">${v.def}</div>
      <div class="word-ex">"${v.ex}"</div>
    </div>`).join('')}
  </div>`;
}

function speak(word){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';u.rate=0.85;
  window.speechSynthesis.speak(u);
}

// ── QUIZ ──
function renderQuiz(u,w,k,isBook){
  const qk=k+(isBook?'_bq':'_q');
  const qs=w.quiz;
  const state=quizState[qk]||{};
  let html=`<div class="quiz-card">
    <h3 style="margin-bottom:16px;color:#2b6cb0">❓ ${isBook?'Book ':''} Quiz — ${qs.length} Questions</h3>`;
  qs.forEach((q,qi)=>{
    const qs2=state.submitted?state.answers:null;
    html+=`<div class="quiz-q">
      <p>${qi+1}. ${q.q}</p>
      <div class="mc-opts">`;
    q.opts.forEach((opt,oi)=>{
      let cls='';
      if(state.submitted){
        if(oi===q.ans) cls='correct';
        else if(oi===state.answers[qi]) cls='wrong';
      }
      html+=`<button class="mc-opt ${cls}" ${state.submitted?'disabled':''} 
        onclick="selectQuizAnswer('${qk}',${qi},${oi})"
        id="qa_${qk}_${qi}_${oi}"
        style="${!state.submitted&&state.answers&&state.answers[qi]===oi?'border-color:#2b6cb0;background:#ebf8ff':''}"
      >${opt}</button>`;
    });
    html+=`</div></div>`;
  });
  if(!state.submitted){
    html+=`<button class="submit-quiz" onclick="submitQuiz('${qk}',${qs.length})">Submit Quiz</button>`;
  } else {
    const score=qs.filter((q,i)=>state.answers[i]===q.ans).length;
    html+=`<div class="quiz-score" style="display:block">
      Score: ${score}/${qs.length} ${score===qs.length?'🎉 Perfect!':score>=qs.length*.7?'👍 Great job!':'📖 Review and try again!'}
    </div>
    <button class="submit-quiz" style="background:#718096;margin-top:8px" onclick="retakeQuiz('${qk}')">Retake Quiz</button>`;
  }
  html+=`</div>`;
  return html;
}

function selectQuizAnswer(qk,qi,oi){
  if(!quizState[qk]) quizState[qk]={answers:{}};
  if(!quizState[qk].answers) quizState[qk].answers={};
  if(quizState[qk].submitted) return;
  quizState[qk].answers[qi]=oi;
  save(); refreshQuizTab();
}

function submitQuiz(qk,total){
  if(!quizState[qk]||!quizState[qk].answers||Object.keys(quizState[qk].answers).length<total){
    alert('Please answer all questions before submitting!');return;
  }
  quizState[qk].submitted=true;
  save(); refreshQuizTab();
}

function retakeQuiz(qk){
  delete quizState[qk];
  save(); refreshQuizTab();
}

function refreshQuizTab(){
  const u=UNITS[curUnit],w=u.weeks[curWeek];
  const k=`u${u.id}w${w.num}`;
  const hasBQ=!!w.book_quiz;
  const i=4;
  const tc=document.getElementById('tc-'+i);
  if(tc) tc.innerHTML=renderQuiz(u,w,k,false);
  if(hasBQ){
    const tc2=document.getElementById('tc-5');
    if(tc2) tc2.innerHTML=renderBookQuiz(u,w,k);
  }
}

// ── BOOK QUIZ ──
function renderBookQuiz(u,w,k){
  const bq=w.book_quiz;
  if(!bq) return '';
  const qk=k+'_bq';
  const state=quizState[qk]||{};
  let html=`<div class="book-quiz-card">
    <div class="book-quiz-title">📚 ${bq.title}</div>`;
  bq.questions.forEach((q,qi)=>{
    html+=`<div class="quiz-q">
      <p>${qi+1}. ${q.q}</p>
      <div class="mc-opts">`;
    q.opts.forEach((opt,oi)=>{
      let cls='';
      if(state.submitted){
        if(oi===q.ans) cls='correct';
        else if(oi===state.answers?.[qi]) cls='wrong';
      }
      html+=`<button class="mc-opt ${cls}" ${state.submitted?'disabled':''} 
        onclick="selectQuizAnswer('${qk}',${qi},${oi})"
        style="${!state.submitted&&state.answers&&state.answers[qi]===oi?'border-color:#2b6cb0;background:#ebf8ff':''}"
      >${opt}</button>`;
    });
    html+=`</div></div>`;
  });
  if(!state.submitted){
    html+=`<button class="submit-quiz" onclick="submitQuiz('${qk}',${bq.questions.length})">Submit Book Quiz</button>`;
  } else {
    const score=bq.questions.filter((q,i)=>state.answers?.[i]===q.ans).length;
    html+=`<div class="quiz-score" style="display:block">Score: ${score}/${bq.questions.length} ${score===bq.questions.length?'🎉 Perfect!':score>=3?'👍 Great!':'📖 Re-read and try again!'}</div>
    <button class="submit-quiz" style="background:#718096;margin-top:8px" onclick="retakeQuiz('${qk}')">Retake</button>`;
  }
  html+=`</div>`;
  return html;
}

// ── SETTINGS ──
function openSettings(){
  document.getElementById('api-key-input').value=localStorage.getItem('joey_api_key')||'';
  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings(){document.getElementById('settings-modal').classList.remove('open');}
function saveSettings(){
  const k=document.getElementById('api-key-input').value.trim();
  if(k) localStorage.setItem('joey_api_key',k);
  else localStorage.removeItem('joey_api_key');
  closeSettings();
  alert('Settings saved!');
}

renderHome();
updateProgressBar();
</script>
