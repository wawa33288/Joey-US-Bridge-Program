<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joey's Year 1 — U.S. History & ELA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh}
header{background:linear-gradient(135deg,#2b6cb0,#2c7a7b);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1.2rem;font-weight:700}
#prog-bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;flex:1;margin:0 16px}
#prog-fill{height:100%;background:#68d391;border-radius:3px;transition:width .5s}
#settings-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
#settings-btn:hover{background:rgba(255,255,255,.25)}
.view{display:none;padding:20px;max-width:960px;margin:0 auto}
.view.active{display:block}
.breadcrumb{font-size:.85rem;color:#718096;margin-bottom:16px;cursor:pointer}
.breadcrumb span:hover{color:#2b6cb0;text-decoration:underline}

/* HOME */
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
.unit-card{background:#fff;border-radius:14px;padding:24px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);border-top:5px solid;transition:transform .15s,box-shadow .15s}
.unit-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.14)}
.unit-icon{font-size:2.4rem;margin-bottom:10px}
.unit-title{font-size:1.1rem;font-weight:700;color:#1a202c;margin-bottom:4px}
.unit-sub{font-size:.85rem;color:#718096;margin-bottom:12px}
.unit-progress{font-size:.8rem;color:#718096}
.progress-dots{display:flex;gap:4px;margin-top:6px}
.dot{width:14px;height:14px;border-radius:50%;background:#e2e8f0}
.dot.done{background:#68d391}

/* UNIT VIEW */
.unit-header{background:#fff;border-radius:14px;padding:20px;margin-bottom:20px;border-left:6px solid;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.unit-header .icon{font-size:2.5rem}
.weeks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.week-card{background:#fff;border-radius:12px;padding:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07);border:2px solid #e2e8f0;transition:all .15s}
.week-card:hover{border-color:#2b6cb0;box-shadow:0 4px 14px rgba(43,108,176,.15)}
.week-card.completed{border-color:#68d391;background:#f0fff4}
.week-num{font-size:.75rem;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.05em}
.week-title{font-size:.95rem;font-weight:600;color:#1a202c;margin-top:4px}
.week-checkmark{color:#68d391;float:right;font-size:1.2rem}

/* WEEK VIEW */
.week-header{background:#fff;border-radius:14px;padding:20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:8px 16px;border-radius:8px;border:2px solid #e2e8f0;background:#fff;cursor:pointer;font-size:.9rem;font-weight:600;color:#4a5568;transition:all .15s}
.tab-btn.active{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
.tab-btn:hover:not(.active){border-color:#2b6cb0;color:#2b6cb0}
.tab-content{display:none}
.tab-content.active{display:block}

/* READ */
.reading-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:16px}
.reading-card h3{font-size:1.1rem;color:#2b6cb0;margin-bottom:12px}
.reading-text{line-height:1.8;color:#2d3748;font-size:1rem}
.vid-list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.vid-link{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#ebf8ff;border-radius:8px;text-decoration:none;color:#2b6cb0;font-weight:600;font-size:.9rem;transition:background .15s}
.vid-link:hover{background:#bee3f8}
.vid-link .vid-note{font-weight:400;color:#4a5568;font-size:.8rem;margin-left:auto}

/* GRAMMAR */
.grammar-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:16px}
.std-tag{display:inline-block;background:#ebf8ff;color:#2b6cb0;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.grammar-card h3{font-size:1.05rem;color:#1a202c;margin-bottom:10px}
.lesson-box{background:#fffbeb;border-left:4px solid #f6ad55;padding:14px 16px;border-radius:0 8px 8px 0;margin-bottom:18px;font-size:.95rem;line-height:1.7;color:#744210}
.exercise{background:#f7fafc;border-radius:10px;padding:16px;margin-bottom:12px}
.exercise p{font-size:.95rem;color:#2d3748;margin-bottom:10px;font-weight:500}
.mc-opts{display:flex;flex-direction:column;gap:6px}
.mc-opt{padding:8px 14px;border-radius:7px;border:2px solid #e2e8f0;background:#fff;cursor:pointer;font-size:.9rem;text-align:left;transition:all .15s}
.mc-opt:hover:not(:disabled){border-color:#2b6cb0;background:#ebf8ff}
.mc-opt.correct{border-color:#68d391;background:#f0fff4;color:#276749}
.mc-opt.wrong{border-color:#fc8181;background:#fff5f5;color:#c53030}
.fill-in{border:2px solid #e2e8f0;border-radius:6px;padding:5px 10px;font-size:.95rem;width:140px;margin:0 4px}
.fill-in.ok{border-color:#68d391;background:#f0fff4}
.fill-in.err{border-color:#fc8181;background:#fff5f5}
.fill-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fill-hint{font-size:.8rem;color:#718096;font-style:italic;margin-top:4px}
.check-btn{padding:5px 14px;background:#2b6cb0;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}
.check-btn:hover{background:#2c5282}
.explain-box{background:#e6fffa;border-left:4px solid #38b2ac;padding:10px 14px;border-radius:0 7px 7px 0;font-size:.88rem;color:#234e52;margin-top:8px;display:none}
.spot-words{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.spot-word{padding:6px 12px;background:#edf2f7;border-radius:6px;cursor:pointer;font-size:.95rem;border:2px solid transparent;transition:all .15s}
.spot-word:hover{background:#e2e8f0}
.spot-word.wrong-click{border-color:#fc8181;background:#fff5f5}
.spot-word.correct-click{border-color:#68d391;background:#f0fff4}
.feedback-msg{margin-top:8px;font-size:.88rem;padding:8px 12px;border-radius:6px}
.feedback-msg.ok{background:#f0fff4;color:#276749}
.feedback-msg.err{background:#fff5f5;color:#c53030}

/* WRITE */
.write-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:16px}
.write-card h3{font-size:1.05rem;color:#6b46c1;margin-bottom:6px}
.milestone-tag{display:inline-block;background:#faf5ff;color:#6b46c1;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:10px;border:1px solid #d6bcfa}
.write-prompt{background:#faf5ff;border-left:4px solid #6b46c1;padding:14px 16px;border-radius:0 8px 8px 0;font-size:.95rem;line-height:1.7;color:#44337a;margin-bottom:14px}
.write-area{width:100%;min-height:160px;border:2px solid #e2e8f0;border-radius:10px;padding:14px;font-size:.95rem;line-height:1.8;font-family:inherit;resize:vertical}
.write-area:focus{outline:none;border-color:#6b46c1}
.write-controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.save-btn{padding:8px 18px;background:#6b46c1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.save-btn:hover{background:#553c9a}
.ai-btn{padding:8px 18px;background:#d69e2e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.ai-btn:hover{background:#b7791f}
.ai-feedback{margin-top:14px;background:#fffbeb;border:1px solid #f6ad55;border-radius:10px;padding:14px;font-size:.9rem;line-height:1.7;color:#744210;white-space:pre-wrap}
.saved-note{font-size:.8rem;color:#68d391;margin-top:6px}

/* WORDS */
.words-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.word-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-top:3px solid #48bb78}
.word-top{display:flex;align-items:center;justify-content:space-between}
.word-w{font-size:1.15rem;font-weight:700;color:#1a202c}
.word-ph{font-size:.8rem;color:#718096;font-style:italic}
.word-pos{font-size:.75rem;background:#e6fffa;color:#276749;padding:2px 8px;border-radius:99px;margin:6px 0}
.word-def{font-size:.9rem;color:#2d3748;margin-bottom:6px;line-height:1.5}
.word-ex{font-size:.85rem;color:#718096;font-style:italic;line-height:1.4}
.speak-btn{background:none;border:none;cursor:pointer;font-size:1.2rem;padding:2px 6px;border-radius:6px;transition:background .15s}
.speak-btn:hover{background:#e2e8f0}

/* QUIZ */
.quiz-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:16px}
.quiz-q{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #e2e8f0}
.quiz-q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.quiz-q p{font-size:.95rem;font-weight:600;color:#1a202c;margin-bottom:10px}
.quiz-score{background:#ebf8ff;border-radius:10px;padding:14px;text-align:center;font-size:1.1rem;font-weight:700;color:#2b6cb0;margin-top:16px;display:none}
.submit-quiz{padding:10px 24px;background:#2b6cb0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:1rem;margin-top:14px;display:block}
.submit-quiz:hover{background:#2c5282}
.book-quiz-card{background:#fff9db;border:2px solid #f6ad55;border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.book-quiz-title{font-size:1rem;font-weight:700;color:#744210;margin-bottom:16px}

/* SETTINGS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin-bottom:16px;color:#1a202c}
.modal label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:600;color:#2d3748}
.modal input{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:.95rem;margin-bottom:16px}
.modal input:focus{outline:none;border-color:#2b6cb0}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn-primary{padding:8px 20px;background:#2b6cb0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.btn-secondary{padding:8px 20px;background:#e2e8f0;color:#2d3748;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.home-title{font-size:1.8rem;font-weight:800;color:#1a202c;margin-bottom:4px}
.home-sub{color:#718096;font-size:1rem;margin-bottom:24px}
</style>
</head>
<body>

<header>
  <h1>🇺🇸 Joey's Year 1</h1>
  <div id="prog-bar"><div id="prog-fill" style="width:0%"></div></div>
  <button id="settings-btn" onclick="openSettings()">⚙ Settings</button>
</header>

<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙ Settings</h2>
    <label>Claude API Key (for AI writing feedback)</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-...">
    <p style="font-size:.8rem;color:#718096;margin-bottom:16px">Your key is stored only in this browser. Get a key at console.anthropic.com</p>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeSettings()">Cancel</button>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<div id="view-home" class="view active">
  <div class="home-title">📚 Grade 4 U.S. History & ELA</div>
  <div class="home-sub">6 units · 30 weeks · All Massachusetts ELA Standards</div>
  <div class="units-grid" id="units-grid"></div>
</div>

<div id="view-unit" class="view">
  <div class="breadcrumb"><span onclick="showHome()">🏠 Home</span> › <span id="bc-unit"></span></div>
  <div class="unit-header" id="unit-header"></div>
  <h3 style="margin-bottom:14px;color:#4a5568">Select a Week</h3>
  <div class="weeks-grid" id="weeks-grid"></div>
</div>

<div id="view-week" class="view">
  <div class="breadcrumb">
    <span onclick="showHome()">🏠 Home</span> ›
    <span id="bc-unit2" onclick="showUnit()"></span> ›
    <span id="bc-week"></span>
  </div>
  <div class="week-header" id="week-header"></div>
  <div class="tabs" id="tabs"></div>
  <div id="tab-contents"></div>
</div>

<script>
const UNITS = [{"id": 1, "title": "The 50 States & Regions", "sub": "Exploring America", "color": "#4299e1", "icon": "🗺️", "book": null, "writing_project": {"title": "My State Report", "desc": "Write a 3-paragraph informative report about one U.S. state. Each week you complete one milestone toward the finished report."}, "weeks": [{"num": 1, "title": "America's Five Regions", "read": {"title": "America Is Divided Into Regions", "text": "The United States has 50 states, but geographers divide the country into five main regions: the Northeast, the South, the Midwest, the Southwest, and the West. Each region has its own geography, climate, and culture. The Northeast is known for cold winters and big cities like New York. The South is famous for warm weather and beautiful beaches. The Midwest has wide-open plains perfect for farming. The Southwest has deserts and canyons. The West has tall mountains and the Pacific Ocean coastline. Learning about regions helps us understand how big and varied our country really is.", "vids": [{"label": "The 5 Regions of the U.S.", "url": "https://www.youtube.com/watch?v=w_XsEflqeTY", "note": "Kids Academy"}, {"label": "50 States Song", "url": "https://www.youtube.com/watch?v=ALmFA3P0urM", "note": "Learn all 50 states"}]}, "grammar": {"std": "L.4.2.a", "topic": "Capitalizing Proper Nouns", "lesson": "We always capitalize the names of specific places — states, cities, and regions. 'Northeast' is capitalized because it names a specific U.S. region. Common nouns like 'region' or 'state' are NOT capitalized unless they begin a sentence.", "exercises": [{"type": "mc", "q": "Which sentence uses capital letters correctly?", "opts": ["I live in the midwest region.", "I live in the Midwest region.", "I live in the midwest Region.", "i live in the Midwest Region."], "ans": 1}, {"type": "fill", "sentence": "The ___ is home to many big cities like New York and Boston.", "ans": "Northeast", "hint": "It names a specific U.S. region — capitalize it!"}, {"type": "spot", "q": "Click the word that should be capitalized:", "words": ["She", "loves", "the", "southwest", "desert."], "errorIdx": 3, "errorCorrect": "Southwest", "explain": "'Southwest' names a specific U.S. region and must always be capitalized."}]}, "write": {"milestone": "Week 1 — Choose Your State", "prompt": "Pick one U.S. state you'd like to report on. Write 2–3 sentences: Which state did you choose? Why does it interest you? What do you already know about it?"}, "words": [{"w": "region", "ph": "REE-juhn", "pos": "noun", "def": "A large area that shares similar features", "ex": "The Midwest region has many farms."}, {"w": "geography", "ph": "jee-AH-gruh-fee", "pos": "noun", "def": "The study of Earth's land, water, and people", "ex": "We study geography to learn about different places."}, {"w": "climate", "ph": "KLY-mut", "pos": "noun", "def": "The usual weather in a place over many years", "ex": "The climate in the South is warm and humid."}, {"w": "border", "ph": "BOR-der", "pos": "noun", "def": "The line that separates two states or countries", "ex": "The Rio Grande forms a border between Texas and Mexico."}, {"w": "culture", "ph": "KUL-cher", "pos": "noun", "def": "The traditions, food, music, and way of life shared by a group", "ex": "Each region of America has its own culture."}, {"w": "landform", "ph": "LAND-form", "pos": "noun", "def": "A natural feature of Earth's surface, like a mountain or valley", "ex": "The Rocky Mountains are a famous landform in the West."}, {"w": "plateau", "ph": "pla-TOH", "pos": "noun", "def": "A flat area of land that is higher than the land around it", "ex": "The Colorado Plateau is a famous high, flat landscape."}, {"w": "plain", "ph": "PLAYN", "pos": "noun", "def": "A large, flat area of land with few trees", "ex": "Wheat grows on the great plains of Kansas."}, {"w": "coastline", "ph": "KOHST-lyn", "pos": "noun", "def": "The outline of a coast — where land meets the sea", "ex": "California has a long, beautiful coastline along the Pacific."}, {"w": "peninsula", "ph": "peh-NIN-syoo-luh", "pos": "noun", "def": "A piece of land surrounded by water on three sides", "ex": "Florida is a peninsula bordered by the Atlantic Ocean and the Gulf of Mexico."}], "quiz": [{"q": "How many main regions does the United States have?", "opts": ["3", "4", "5", "6"], "ans": 2}, {"q": "Which region is known for wide-open plains and farming?", "opts": ["Northeast", "South", "Midwest", "West"], "ans": 2}, {"q": "What does geography study?", "opts": ["Only weather", "Earth's land, water, and people", "Just oceans", "History of wars"], "ans": 1}, {"q": "Which region has deserts and canyons?", "opts": ["Northeast", "Southwest", "Midwest", "South"], "ans": 1}, {"q": "What is climate?", "opts": ["A type of landform", "The study of maps", "The usual weather in a place over many years", "A region of the country"], "ans": 2}, {"q": "What is a peninsula?", "opts": ["A mountain peak", "Land surrounded by water on three sides", "A flat high plain", "A desert canyon"], "ans": 1}, {"q": "Which ocean borders the West Coast of the United States?", "opts": ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"], "ans": 3}, {"q": "What is a plateau?", "opts": ["A low valley", "A flat area of land higher than surrounding land", "A river delta", "A type of coastline"], "ans": 1}, {"q": "Which region is the smallest by land area?", "opts": ["South", "Midwest", "Northeast", "West"], "ans": 2}, {"q": "What does 'culture' include?", "opts": ["Only food", "Only music", "Traditions, food, music, and way of life", "Only language"], "ans": 3}]}, {"num": 2, "title": "The Northeast Region", "read": {"title": "Exploring the Northeast", "text": "The Northeast is the smallest region by area, but it is home to some of America's most important cities. States like Massachusetts, New York, and Pennsylvania are in the Northeast. This region has cold, snowy winters and warm summers. The Northeast was one of the first areas where European settlers came to live. Boston, Massachusetts was a key city during the American Revolution. Today the Northeast is famous for its universities, museums, and beautiful fall colors when leaves change in October. Many people visit New England in autumn just to see the brilliant red, orange, and yellow leaves on the trees.", "vids": []}, "grammar": {"std": "L.4.2.b", "topic": "Commas in a Series", "lesson": "When you list three or more items, put a comma after each item except the last. Example: 'The Northeast has mountains, rivers, and cities.' The comma before 'and' is called the Oxford comma. It makes lists clear and easy to read.", "exercises": [{"type": "mc", "q": "Which sentence uses commas correctly?", "opts": ["New York Boston and Philadelphia are big cities.", "New York, Boston, and Philadelphia are big cities.", "New York, Boston and, Philadelphia are big cities.", "New York Boston, and Philadelphia, are big cities."], "ans": 1}, {"type": "fill", "sentence": "The Northeast has mountains, forests, ___ beautiful coastlines.", "ans": "and", "hint": "What word connects the last item in a list?"}, {"type": "spot", "q": "Click the word after which a comma is missing:", "words": ["She", "visited", "New", "York", "Boston", "and", "Philadelphia."], "errorIdx": 4, "errorCorrect": "Boston,", "explain": "You need a comma after 'Boston' because it is the second item in a list of three cities."}]}, "write": {"milestone": "Week 2 — Introduction Paragraph", "prompt": "Write your opening paragraph. Include: the state's name, which region it is in, and one surprising or interesting fact. Write 3–4 sentences that make the reader want to learn more!"}, "words": [{"w": "settler", "ph": "SET-ler", "pos": "noun", "def": "A person who moves to a new area to make it their permanent home", "ex": "Early settlers built farms in the Northeast."}, {"w": "revolution", "ph": "rev-uh-LOO-shun", "pos": "noun", "def": "A sudden, major change — often when people fight to change their government", "ex": "The American Revolution gave the colonies independence from Britain."}, {"w": "colony", "ph": "KAH-luh-nee", "pos": "noun", "def": "A territory controlled by a faraway country", "ex": "Massachusetts was one of the original 13 colonies."}, {"w": "university", "ph": "yoo-nih-VER-sih-tee", "pos": "noun", "def": "A large school where students study after high school", "ex": "Harvard University is located in Cambridge, Massachusetts."}, {"w": "autumn", "ph": "AW-tum", "pos": "noun", "def": "The season between summer and winter; also called fall", "ex": "The leaves turn red and orange in autumn."}, {"w": "brilliant", "ph": "BRIL-yunt", "pos": "adjective", "def": "Very bright and vivid in color", "ex": "The brilliant red leaves lit up the forest in October."}, {"w": "independence", "ph": "in-deh-PEN-dents", "pos": "noun", "def": "Freedom from being controlled by another group or country", "ex": "The colonies fought for independence from Britain."}, {"w": "historical", "ph": "hih-STOR-ih-kul", "pos": "adjective", "def": "Related to history or important past events", "ex": "Boston has many historical buildings from colonial times."}, {"w": "dense", "ph": "DENS", "pos": "adjective", "def": "Closely packed together; thick", "ex": "The Northeast has dense forests and many urban areas close together."}, {"w": "harbor", "ph": "HAR-ber", "pos": "noun", "def": "A sheltered area of water where ships can dock safely", "ex": "Boston Harbor was the site of the famous Tea Party protest."}], "quiz": [{"q": "Which state is NOT in the Northeast?", "opts": ["Massachusetts", "New York", "Pennsylvania", "Georgia"], "ans": 3}, {"q": "What is the Northeast known for in October?", "opts": ["Snowstorms", "Colorful fall leaves", "Warm beaches", "Tornadoes"], "ans": 1}, {"q": "Which city was important during the American Revolution?", "opts": ["Los Angeles", "Chicago", "Boston", "Miami"], "ans": 2}, {"q": "What is a colony?", "opts": ["A type of bird", "A territory controlled by another country", "A mountain range", "A type of farm"], "ans": 1}, {"q": "What does 'independent' mean?", "opts": ["Dependent on others", "Free from outside control", "Part of a colony", "Ruled by a king"], "ans": 1}, {"q": "What is a harbor?", "opts": ["A mountain pass", "A sheltered area of water for ships", "A type of forest", "A plains region"], "ans": 1}, {"q": "Which famous university is in Massachusetts?", "opts": ["Yale", "Princeton", "Harvard", "MIT only"], "ans": 2}, {"q": "What season comes after summer?", "opts": ["Spring", "Winter", "Autumn", "None of these"], "ans": 2}, {"q": "What does 'dense' mean?", "opts": ["Empty and sparse", "Closely packed together", "Extremely tall", "Flat and open"], "ans": 1}, {"q": "Why did the Boston Tea Party happen?", "opts": ["To celebrate tea", "To protest unfair taxes from Britain", "To open a new harbor", "To start a new colony"], "ans": 1}]}, {"num": 3, "title": "The South & Southeast", "read": {"title": "The Warm and Welcoming South", "text": "The South is one of the largest regions of the United States. It includes states like Florida, Texas, Georgia, and Louisiana. The South is known for its warm climate, with hot summers and mild winters. This region is famous for its history, music, and food. New Orleans, Louisiana is famous for jazz music and delicious Creole cooking. Georgia is called the 'Peach State' because it grows so many peaches. The Mississippi River flows through the South and has been important for transportation and trade for hundreds of years. Many different cultures — Native American, African American, and European — have shaped the South's unique identity.", "vids": []}, "grammar": {"std": "L.4.4.b", "topic": "Greek and Latin Roots: geo- and terr-", "lesson": "Many English words come from Greek and Latin roots. The root 'geo-' (Greek) means 'earth.' The root 'terr-' (Latin) also means 'land' or 'earth.' Knowing roots helps you figure out the meaning of unfamiliar words! Examples: geography (writing/study of earth), geology (study of earth's layers), terrain (type of land), territory (an area of land).", "exercises": [{"type": "mc", "q": "If 'geo-' means earth, what does 'geologist' most likely study?", "opts": ["Stars and planets", "Rocks and Earth's layers", "Ocean animals", "The weather"], "ans": 1}, {"type": "fill", "sentence": "The rocky ___ of the Appalachian Mountains made the hike very challenging.", "ans": "terrain", "hint": "Think of the Latin root 'terr-' meaning land."}, {"type": "spot", "q": "Which word does NOT use 'terr-' to mean land?", "words": ["territory", "terrify", "terrain", "terrace"], "errorIdx": 1, "errorCorrect": "(terrify = fear, not land)", "explain": "'Terrify' comes from 'terror' (fear), not from 'terr-' meaning land. Territory, terrain, and terrace all relate to land or area."}]}, "write": {"milestone": "Week 3 — Geography Paragraph", "prompt": "Write a paragraph describing your state's geography. Where is it located? What landforms does it have (mountains, rivers, plains, coast)? What is the climate like? Use at least 4 sentences and include two geography vocabulary words."}, "words": [{"w": "humid", "ph": "HYOO-mid", "pos": "adjective", "def": "When the air contains a lot of moisture or water vapor", "ex": "Summer in the South can be very hot and humid."}, {"w": "tradition", "ph": "truh-DIH-shun", "pos": "noun", "def": "A custom or practice passed down through generations", "ex": "Eating gumbo is a food tradition in Louisiana."}, {"w": "transportation", "ph": "trans-por-TAY-shun", "pos": "noun", "def": "Ways of moving people or goods from place to place", "ex": "The Mississippi River was used for transportation of goods."}, {"w": "identity", "ph": "eye-DEN-tih-tee", "pos": "noun", "def": "The qualities that make a person or place unique", "ex": "Jazz music is part of New Orleans' identity."}, {"w": "terrain", "ph": "teh-RAYN", "pos": "noun", "def": "The natural features of an area of land", "ex": "The terrain in the Appalachian Mountains is rugged and hilly."}, {"w": "mild", "ph": "MYLD", "pos": "adjective", "def": "Not too hot or cold; gentle and moderate", "ex": "The South has mild winters compared to the Northeast."}, {"w": "delta", "ph": "DEL-tuh", "pos": "noun", "def": "A triangle-shaped area of land formed where a river meets the sea", "ex": "The Mississippi River Delta is a rich wetland in Louisiana."}, {"w": "swamp", "ph": "SWOMP", "pos": "noun", "def": "A wetland area with trees, often covered in shallow water", "ex": "The Florida Everglades is a famous swamp ecosystem."}, {"w": "tributary", "ph": "TRIB-yoo-tair-ee", "pos": "noun", "def": "A smaller river that flows into a larger river", "ex": "The Ohio River is a major tributary of the Mississippi."}, {"w": "territory", "ph": "TAIR-ih-tor-ee", "pos": "noun", "def": "An area of land belonging to or controlled by a government", "ex": "The Louisiana Purchase added vast territory to the United States."}], "quiz": [{"q": "Which state is in the South?", "opts": ["Maine", "Ohio", "Georgia", "Montana"], "ans": 2}, {"q": "Why is Georgia called the 'Peach State'?", "opts": ["It has peach-colored sunsets", "It grows many peaches", "Its flag has a peach", "It was named after a peach farmer"], "ans": 1}, {"q": "What is New Orleans famous for?", "opts": ["Country music", "Jazz music", "Rock and roll", "Classical music"], "ans": 1}, {"q": "What does the root 'geo-' mean?", "opts": ["Water", "Sky", "Earth", "Fire"], "ans": 2}, {"q": "What is a delta?", "opts": ["A mountain peak", "A triangle-shaped land where a river meets the sea", "A high plateau", "A desert canyon"], "ans": 1}, {"q": "Which river is one of the most important in the South?", "opts": ["Colorado River", "Hudson River", "Mississippi River", "Rio Grande"], "ans": 2}, {"q": "What does 'humid' mean?", "opts": ["Very cold", "Having lots of moisture in the air", "Extremely windy", "Very dry"], "ans": 1}, {"q": "What is a tributary?", "opts": ["A type of mountain", "A smaller river that flows into a larger one", "A desert plain", "A coastal wetland"], "ans": 1}, {"q": "Which word comes from the Latin root 'terr-' meaning land?", "opts": ["terrify", "terrible", "territory", "terror"], "ans": 2}, {"q": "What is a swamp?", "opts": ["A high mountain area", "A dry desert", "A wetland with trees often covered in shallow water", "A flat prairie"], "ans": 2}]}, {"num": 4, "title": "The Midwest & West", "read": {"title": "The Heartland and the Wild West", "text": "The Midwest is often called 'America's Heartland' because of its central location and important farmland. States like Iowa, Illinois, and Kansas grow huge amounts of corn, wheat, and soybeans. Chicago, Illinois is one of the biggest cities in the country and is known for its amazing architecture. The West includes states like California, Colorado, and Washington. The Rocky Mountains stretch through many western states, reaching heights over 14,000 feet. California has the largest population of any U.S. state and is famous for its technology industry. The West Coast faces the Pacific Ocean, where shipping and fishing are very important to the economy.", "vids": []}, "grammar": {"std": "L.4.1.a", "topic": "Relative Pronouns: who, which, that", "lesson": "A relative pronoun introduces a clause that describes a noun. Use 'who' for people, 'which' for things (in extra information), and 'that' for things (in necessary information). Examples: 'The farmer who grows corn lives in Iowa.' 'The Rocky Mountains, which are very tall, are in the West.' 'The state that has the most people is California.'", "exercises": [{"type": "mc", "q": "Choose the correct relative pronoun: 'The city ___ has the most skyscrapers is Chicago.'", "opts": ["who", "whom", "which", "that"], "ans": 3}, {"type": "fill", "sentence": "The geographer ___ studies the Midwest says it has the best farmland.", "ans": "who", "hint": "Use 'who' for a person."}, {"type": "spot", "q": "Click the relative pronoun in this sentence:", "words": ["California,", "which", "has", "beaches", "and", "mountains,", "is", "in", "the", "West."], "errorIdx": 1, "errorCorrect": "which", "explain": "'Which' is the relative pronoun introducing extra information about California."}]}, "write": {"milestone": "Week 4 — Famous Facts Paragraph", "prompt": "Write a paragraph about something your state is famous for — a famous person, landmark, food, industry, or tradition. Include at least 2 specific facts. Aim for 4–5 sentences. Try using a relative pronoun (who, which, or that) at least once."}, "words": [{"w": "heartland", "ph": "HART-land", "pos": "noun", "def": "The central part of a country, especially an agricultural area", "ex": "Iowa is part of America's heartland."}, {"w": "architecture", "ph": "AR-kih-tek-cher", "pos": "noun", "def": "The design and style of buildings", "ex": "Chicago is famous for its bold, innovative architecture."}, {"w": "population", "ph": "pop-yoo-LAY-shun", "pos": "noun", "def": "The total number of people living in a place", "ex": "California has the largest population of any U.S. state."}, {"w": "diverse", "ph": "dih-VERS", "pos": "adjective", "def": "Including many different types, peoples, or ideas", "ex": "America is a diverse country with people from every background."}, {"w": "vast", "ph": "VAST", "pos": "adjective", "def": "Very large in size or amount", "ex": "The western United States is vast and has many wide-open spaces."}, {"w": "economy", "ph": "ih-KAH-nuh-mee", "pos": "noun", "def": "The system of how money, goods, and services are produced and used", "ex": "Agriculture is a major part of the Midwest economy."}, {"w": "technology", "ph": "tek-NAH-luh-jee", "pos": "noun", "def": "The use of science and inventions to solve problems", "ex": "Silicon Valley in California is the center of America's technology industry."}, {"w": "agriculture", "ph": "AG-rih-kul-cher", "pos": "noun", "def": "The science and practice of farming", "ex": "Agriculture is the backbone of the Midwest region."}, {"w": "elevation", "ph": "el-uh-VAY-shun", "pos": "noun", "def": "The height of a place above sea level", "ex": "Some Rocky Mountain peaks have an elevation over 14,000 feet."}, {"w": "industry", "ph": "IN-duh-stree", "pos": "noun", "def": "A group of businesses that make the same kind of product or service", "ex": "The fishing industry is important along the West Coast."}], "quiz": [{"q": "Why is the Midwest called 'America's Heartland'?", "opts": ["It has heart-shaped lakes", "It is central and has important farmland", "It has the most people", "It is the oldest region"], "ans": 1}, {"q": "Which city is one of the largest in the Midwest?", "opts": ["Dallas", "Denver", "Chicago", "Seattle"], "ans": 2}, {"q": "Which state has the largest population?", "opts": ["Texas", "New York", "Florida", "California"], "ans": 3}, {"q": "Which relative pronoun is used for people?", "opts": ["which", "that", "who", "where"], "ans": 2}, {"q": "What is agriculture?", "opts": ["Building design", "The science and practice of farming", "The study of maps", "Ocean fishing"], "ans": 1}, {"q": "What is the Rocky Mountains' highest point approximately?", "opts": ["5,000 feet", "8,000 feet", "14,000+ feet", "20,000 feet"], "ans": 2}, {"q": "What does 'economy' mean?", "opts": ["A type of landform", "The system of money, goods, and services", "The study of weather", "A government law"], "ans": 1}, {"q": "Where is America's technology industry centered?", "opts": ["Chicago, Illinois", "Austin, Texas", "Silicon Valley, California", "Seattle, Washington"], "ans": 2}, {"q": "Which relative pronoun introduces extra (non-essential) information?", "opts": ["that", "who", "which", "where"], "ans": 2}, {"q": "What does 'elevation' mean?", "opts": ["The depth of a valley", "The width of a river", "Height above sea level", "The distance between cities"], "ans": 2}]}, {"num": 5, "title": "Putting It All Together", "read": {"title": "America: One Nation, Many Regions", "text": "We have now explored all five regions of the United States. Each region has its own special features — from the snowy mountains of the Northeast to the sunny beaches of the South, from the vast farmlands of the Midwest to the dramatic canyons of the Southwest and the towering peaks of the West. But all these regions are connected as one nation. Americans share a common language, national holidays, and a belief in freedom and opportunity. No matter which region you live in, you are part of the great American story. Geography shapes who we are, but our shared values unite us all.", "vids": [{"label": "Exploring All 50 States", "url": "https://www.youtube.com/watch?v=GtEmH7ur3C8", "note": "PBS KIDS"}]}, "grammar": {"std": "L.4.4.a", "topic": "Context Clues", "lesson": "When you find an unfamiliar word, look at the words around it — those are context clues! Types: (1) Definition clue — the word is defined in the sentence. (2) Example clue — examples are given. (3) Contrast clue — an opposite word is shown. Example: 'The terrain was rugged, not smooth and flat at all.' The contrast 'not smooth and flat' tells you 'rugged' means rough and uneven.", "exercises": [{"type": "mc", "q": "'The peaks, or the very tops of the mountains, were covered in snow.' What does 'peaks' mean?", "opts": ["The sides of mountains", "The very tops of mountains", "Mountain trails", "Caves in mountains"], "ans": 1}, {"type": "fill", "sentence": "The arid desert receives very little precipitation — almost no ___ falls all year.", "ans": "rain", "hint": "What falls from the sky as water?"}, {"type": "spot", "q": "Which words are the context clue that helps define 'arid' in: 'The arid desert was bone-dry, with no water for miles.'", "words": ["arid", "desert", "bone-dry,", "water", "miles"], "errorIdx": 2, "errorCorrect": "bone-dry", "explain": "'Bone-dry' is the contrast clue that tells you 'arid' means extremely dry."}]}, "write": {"milestone": "Week 5 — Conclusion & Final Report", "prompt": "Write your conclusion paragraph. Sum up the most interesting things about your state. Why should someone visit? What makes your state unique? Then combine all three paragraphs into your complete State Report!"}, "words": [{"w": "dramatic", "ph": "druh-MAT-ik", "pos": "adjective", "def": "Striking, impressive, and very noticeable", "ex": "The Grand Canyon has dramatic red cliffs and colors."}, {"w": "opportunity", "ph": "op-er-TOO-nih-tee", "pos": "noun", "def": "A chance to do something good or achieve a goal", "ex": "America is known as a land of opportunity."}, {"w": "unite", "ph": "yoo-NYT", "pos": "verb", "def": "To join together as one group", "ex": "Our shared values unite Americans from all regions."}, {"w": "arid", "ph": "AIR-id", "pos": "adjective", "def": "Very dry, with little or no rainfall", "ex": "The Sonoran Desert is one of the most arid places in North America."}, {"w": "precipitation", "ph": "preh-sip-ih-TAY-shun", "pos": "noun", "def": "Water that falls from the sky — rain, snow, sleet, or hail", "ex": "The Pacific Northwest gets a lot of precipitation each year."}, {"w": "unique", "ph": "yoo-NEEK", "pos": "adjective", "def": "One of a kind; unlike anything else", "ex": "Every state has something unique that makes it special."}, {"w": "diverse", "ph": "dih-VERS", "pos": "adjective", "def": "Made up of many different types or people", "ex": "America's diverse population makes it a rich and interesting country."}, {"w": "symbol", "ph": "SIM-bul", "pos": "noun", "def": "Something that stands for or represents an idea or group", "ex": "The bald eagle is a symbol of American strength and freedom."}, {"w": "landmark", "ph": "LAND-mark", "pos": "noun", "def": "An important and recognizable place or building", "ex": "The Grand Canyon is one of America's most famous landmarks."}, {"w": "heritage", "ph": "HAIR-ih-tij", "pos": "noun", "def": "Traditions, values, and culture passed down from earlier generations", "ex": "Each state's heritage includes its history and cultural traditions."}], "quiz": [{"q": "What do all five U.S. regions share?", "opts": ["The same climate", "They are part of one nation", "The same landforms", "The same food"], "ans": 1}, {"q": "What are context clues?", "opts": ["Words in a dictionary", "Nearby words that help you understand an unfamiliar word", "Pictures in a book", "Notes at the bottom of a page"], "ans": 1}, {"q": "Which region has dramatic canyons?", "opts": ["Northeast", "Midwest", "Southwest", "South"], "ans": 2}, {"q": "What does 'unite' mean?", "opts": ["To split apart", "To travel", "To join together", "To celebrate"], "ans": 2}, {"q": "What is precipitation?", "opts": ["A landform", "Water that falls from the sky", "A type of soil", "A kind of climate zone"], "ans": 1}, {"q": "What does 'arid' mean?", "opts": ["Very cold", "Very wet", "Very dry", "Very windy"], "ans": 2}, {"q": "What is a landmark?", "opts": ["A type of map", "An important recognizable place", "A border between states", "A type of farm"], "ans": 1}, {"q": "Which type of context clue shows an opposite meaning?", "opts": ["Definition clue", "Example clue", "Contrast clue", "Picture clue"], "ans": 2}, {"q": "What is heritage?", "opts": ["A modern invention", "Traditions and culture passed down through generations", "A type of geography", "A government document"], "ans": 1}, {"q": "What shared belief connects all Americans?", "opts": ["Same religion", "Same food", "Freedom and opportunity", "Same climate"], "ans": 2}]}]}, {"id": 2, "title": "American Symbols & Landmarks", "sub": "Icons of Our Nation", "color": "#e53e3e", "icon": "🦅", "book": {"title": "Betsy Ross and the American Flag", "author": "Alexandra Wallner", "note": "Weeks 1–4"}, "writing_project": {"title": "Symbol Poem", "desc": "Write a 5-stanza poem about an American symbol. Each week you'll write one stanza and polish your language choices."}, "weeks": [{"num": 1, "title": "National Symbols", "read": {"title": "What Makes a Symbol?", "text": "A national symbol is an object, animal, or image that represents a country and its values. The United States has many national symbols that Americans recognize and feel proud of. The bald eagle became the national bird in 1782. It stands for strength and freedom. The American flag has 50 stars — one for each state — and 13 stripes for the original 13 colonies. The Liberty Bell in Philadelphia, Pennsylvania is a symbol of freedom. The Statue of Liberty in New York Harbor welcomes people from all over the world. Each symbol tells a story about what America stands for.", "vids": [{"label": "U.S. National Symbols for Kids", "url": "https://www.youtube.com/watch?v=eqs1t9JzKkY", "note": "Patriotic Symbols"}]}, "grammar": {"std": "L.4.3.a", "topic": "Choosing Precise Words", "lesson": "Good writers choose specific, precise words instead of vague ones. Instead of 'The eagle is nice,' write 'The eagle is majestic.' Instead of 'The flag is big,' write 'The flag is enormous.' Precise words paint a clearer picture for your reader.", "exercises": [{"type": "mc", "q": "Which sentence uses a more precise word?", "opts": ["The Statue of Liberty is a good symbol.", "The Statue of Liberty is a powerful symbol of freedom.", "The Statue of Liberty is okay.", "The Statue of Liberty is a thing."], "ans": 1}, {"type": "fill", "sentence": "Instead of 'the eagle flew,' write: the eagle ___ through the sky. (use a stronger verb)", "ans": "soared", "hint": "Think of a more dramatic word for flying high."}, {"type": "spot", "q": "Click the vague word that should be replaced with something more precise:", "words": ["The", "Liberty", "Bell", "is", "a", "nice", "symbol", "of", "freedom."], "errorIdx": 5, "errorCorrect": "powerful/historic/famous", "explain": "'Nice' is vague. Use 'powerful,' 'historic,' or 'famous' to be more precise."}]}, "write": {"milestone": "Week 1 — Choose Your Symbol & Write Stanza 1", "prompt": "Choose an American symbol for your poem (flag, eagle, Statue of Liberty, Liberty Bell, etc.). Write Stanza 1 (4 lines) describing what the symbol looks like. Use at least one precise, vivid word in each line."}, "words": [{"w": "symbol", "ph": "SIM-bul", "pos": "noun", "def": "Something that stands for or represents an idea or country", "ex": "The bald eagle is a symbol of American freedom."}, {"w": "represent", "ph": "rep-rih-ZENT", "pos": "verb", "def": "To stand for or speak on behalf of something", "ex": "The 50 stars on the flag represent the 50 states."}, {"w": "patriotic", "ph": "pay-tree-AH-tik", "pos": "adjective", "def": "Showing love and pride for one's country", "ex": "Americans feel patriotic when they see the flag."}, {"w": "liberty", "ph": "LIB-er-tee", "pos": "noun", "def": "The freedom to live and act as you choose", "ex": "The Statue of Liberty represents freedom for all people."}, {"w": "majestic", "ph": "muh-JES-tik", "pos": "adjective", "def": "Grand, impressive, and inspiring great admiration", "ex": "The bald eagle is a majestic bird with a white head."}, {"w": "colony", "ph": "KAH-luh-nee", "pos": "noun", "def": "A territory controlled by a faraway country", "ex": "The 13 stripes on the flag represent the original 13 colonies."}, {"w": "harbor", "ph": "HAR-ber", "pos": "noun", "def": "A sheltered body of water where ships dock", "ex": "The Statue of Liberty stands in New York Harbor."}, {"w": "valor", "ph": "VAL-er", "pos": "noun", "def": "Great bravery, especially in battle", "ex": "The flag honors the valor of soldiers who fought for America."}, {"w": "soar", "ph": "SOR", "pos": "verb", "def": "To fly high and effortlessly through the air", "ex": "The bald eagle can soar for hours on warm air currents."}, {"w": "heritage", "ph": "HAIR-ih-tij", "pos": "noun", "def": "Traditions and values passed down from earlier generations", "ex": "America's national symbols celebrate its rich heritage."}], "book_quiz": {"title": "Betsy Ross and the American Flag — Week 1 Reading", "questions": [{"q": "Who is the main character in the book?", "opts": ["George Washington", "Betsy Ross", "Thomas Jefferson", "Paul Revere"], "ans": 1}, {"q": "What was Betsy Ross's job?", "opts": ["Soldier", "Baker", "Seamstress (sewer)", "Teacher"], "ans": 2}, {"q": "Who asked Betsy Ross to make the first flag?", "opts": ["John Adams", "Benjamin Franklin", "George Washington", "Thomas Jefferson"], "ans": 2}, {"q": "How many stars were on the first American flag?", "opts": ["50", "13", "20", "30"], "ans": 1}, {"q": "What did the stars on the first flag represent?", "opts": ["The number of soldiers", "The original 13 colonies", "The founding fathers", "The states in the North"], "ans": 1}]}, "quiz": [{"q": "What year did the bald eagle become America's national bird?", "opts": ["1776", "1782", "1800", "1812"], "ans": 1}, {"q": "How many stars are on the current American flag?", "opts": ["13", "48", "50", "52"], "ans": 2}, {"q": "What do the 13 stripes on the flag represent?", "opts": ["13 presidents", "The 13 original colonies", "13 states today", "13 battles"], "ans": 1}, {"q": "Where is the Liberty Bell located?", "opts": ["New York", "Washington D.C.", "Philadelphia, PA", "Boston, MA"], "ans": 2}, {"q": "Where does the Statue of Liberty stand?", "opts": ["Boston Harbor", "San Francisco Bay", "New York Harbor", "Chesapeake Bay"], "ans": 2}, {"q": "What does 'majestic' mean?", "opts": ["Small and quiet", "Grand and inspiring great admiration", "Dangerous and fierce", "Old and worn"], "ans": 1}, {"q": "What does 'patriotic' mean?", "opts": ["Feeling afraid", "Showing love and pride for your country", "Being bored with history", "Disliking symbols"], "ans": 1}, {"q": "What does the Statue of Liberty represent?", "opts": ["Military power", "Trade and business", "Freedom and welcome", "Government authority"], "ans": 2}, {"q": "What is a national symbol?", "opts": ["Any old building", "An object or image representing a country and its values", "A president's signature", "A military weapon"], "ans": 1}, {"q": "What does 'liberty' mean?", "opts": ["Duty", "Law", "Freedom", "Power"], "ans": 2}]}, {"num": 2, "title": "The American Flag", "read": {"title": "The Stars and Stripes", "text": "The American flag is one of the most recognized symbols in the world. It has three colors: red, white, and blue. Red stands for courage and valor. White stands for purity and innocence. Blue stands for vigilance, perseverance, and justice. The flag has 50 stars, representing the 50 states, and 13 stripes alternating red and white, representing the original 13 colonies. The Pledge of Allegiance is a promise Americans make to be loyal to the flag and the country it represents. On Flag Day, celebrated every June 14, Americans honor their flag with parades and ceremonies.", "vids": []}, "grammar": {"std": "L.4.5.a", "topic": "Similes", "lesson": "A simile compares two different things using 'like' or 'as.' Similes make writing more vivid and interesting. Examples: 'The red stripes on the flag were as bright as fire.' 'The flag waved like a dancer in the breeze.' Look for 'like' or 'as' to spot a simile!", "exercises": [{"type": "mc", "q": "Which sentence contains a simile?", "opts": ["The flag is red, white, and blue.", "The flag waved like a dancer in the breeze.", "The flag has 50 stars.", "Americans love their flag."], "ans": 1}, {"type": "fill", "sentence": "The stars on the flag sparkled like ___ in the night sky.", "ans": "diamonds", "hint": "What bright, sparkling things do stars in the sky remind you of?"}, {"type": "spot", "q": "Click the simile word (the comparing word) in this sentence: 'The flag was as colorful as a rainbow.'", "words": ["The", "flag", "was", "as", "colorful", "as", "a", "rainbow."], "errorIdx": 3, "errorCorrect": "as...as", "explain": "'As...as' is the simile structure that compares the flag's colors to a rainbow."}]}, "write": {"milestone": "Week 2 — Stanza 2: What It Means", "prompt": "Write Stanza 2 (4 lines) about what your chosen symbol means to Americans. Include at least ONE simile — compare d Betsy suggest for the stars?", "opts": ["Six-pointed", "Eight-pointed", "Five-pointed", "Round"], "ans": 2}, {"q": "Where did Betsy Ross live and work?", "opts": ["Boston", "New York", "Philadelphia", "Washington D.C."], "ans": 2}, {"q": "Why was making the flag a secret at first?", "opts": ["Betsy wanted a surprise", "America was still at war and the flag was a new nation's symbol", "The king of England would be angry", "It was a gift for George Washington"], "ans": 1}, {"q": "What was special about Betsy's way of cutting the five-pointed star?", "opts": ["She used a machine", "She could cut it with one snip of scissors", "She traced it from a coin", "She needed two people to help her"], "ans": 1}]}, "quiz": [{"q": "What color on the flag stands for courage and valor?", "opts": ["White", "Blue", "Red", "Gold"], "ans": 2}, {"q": "What does blue on the flag represent?", "opts": ["Courage", "Purity", "Vigilance and justice", "Independence"], "ans": 2}, {"q": "When is Flag Day celebrated?", "opts": ["July 4", "June 14", "September 11", "November 11"], "ans": 1}, {"q": "What is the Pledge of Allegiance?", "opts": ["A song about America", "A promise of loyalty to the flag and country", "A poem about freedom", "A law about flags"], "ans": 1}, {"q": "What is a simile?", "opts": ["A type of metaphor", "A comparison using 'like' or 'as'", "A rhyming poem", "A definition of a word"], "ans": 1}, {"q": "Which is a simile?", "opts": ["The flag is red.", "The flag is a beacon of hope.", "The flag shone like a star.", "The flag waves."], "ans": 2}, {"q": "What does 'allegiance' mean?", "opts": ["Freedom", "Loyalty and commitment", "Courage", "Celebration"], "ans": 1}, {"q": "What does 'perseverance' mean?", "opts": ["Giving up easily", "Continuing to try hard even when things are difficult", "Being very fast", "Feeling afraid"], "ans": 1}, {"q": "What does white on the flag stand for?", "opts": ["Valor", "Vigilance", "Purity and innocence", "Power"], "ans": 2}, {"q": "How many stripes does the American flag have?", "opts": ["50", "13", "15", "20"], "ans": 1}]}, {"num": 3, "title": "Statues & Monuments", "read": {"title": "America's Great Monuments", "text": "A monument is a structure built to honor a person or event. America has many famous monuments that millions of people visit each year. The Washington Monument in Washington D.C. is a tall white tower built to honor George Washington, the first president. The Lincoln Memorial honors President Abraham Lincoln, who led the country through the Civil War. The Statue of Liberty, a gift from France in 1886, stands 305 feet tall on Liberty Island in New York Harbor. Mount Rushmore in South Dakota has the faces of four presidents carved into a mountain: Washington, Jefferson, Roosevelt, and Lincoln. Each monument reminds us of important moments and people in American history.", "vids": [{"label": "The Statue of Liberty for Kids", "url": "https://www.youtube.com/watch?v=MFuqXdLcgxg", "note": "Statue of Liberty Facts"}]}, "grammar": {"std": "L.4.1.a", "topic": "Relative Pronouns: who, which, that", "lesson": "Relative pronouns connect extra information to a noun. 'Who' is used for people. 'Which' is used for things when the information is extra (set off by commas). 'That' is used for things when the information is necessary. Example: 'Lincoln, who was president during the Civil War, is honored at the Lincoln Memorial.' 'The monument that stands tallest is the Washington Monument.'", "exercises": [{"type": "mc", "q": "Choose the correct relative pronoun: 'The Statue of Liberty, ___ was a gift from France, stands in New York Harbor.'", "opts": ["that", "who", "which", "where"], "ans": 2}, {"type": "fill", "sentence": "George Washington, ___ was the first president, is honored on Mount Rushmore.", "ans": "who", "hint": "Use 'who' for a person."}, {"type": "spot", "q": "Click the relative pronoun in: 'The monument that stands in D.C. honors Lincoln.'", "words": ["The", "monument", "that", "stands", " sed for extra information about a thing?", "opts": ["who", "that", "which", "where"], "ans": 2}, {"q": "What is a monument?", "opts": ["A type of flag", "A structure built to honor a person or event", "A government building", "A national park"], "ans": 1}, {"q": "What is an obelisk?", "opts": ["A type of museum", "A tall four-sided pillar that narrows to a point", "A carved mountain face", "A large dome building"], "ans": 1}, {"q": "What does 'dedicate' mean?", "opts": ["To destroy", "To build quickly", "To officially honor something for a special purpose", "To paint or decorate"], "ans": 2}, {"q": "What is an inscription?", "opts": ["A type of stone", "Words carved or written on a monument", "A monument in a park", "A flag design"], "ans": 1}, {"q": "Where is the Lincoln Memorial located?", "opts": ["New York City", "Philadelphia", "Washington D.C.", "Gettysburg, PA"], "ans": 2}]}, {"num": 4, "title": "National Bird & Animals", "read": {"title": "America's Animal Symbols", "text": "The bald eagle became the official national bird of the United States in 1782 when it was placed on the Great Seal. Bald eagles are not actually bald — their heads are covered in white feathers. They are large, powerful birds that can have a wingspan of up to 8 feet. They live near rivers, lakes, and coasts where they hunt for fish. In the 1970s, bald eagles were endangered because of hunting and a harmful pesticide called DDT. Thanks to conservation efforts and the Endangered Species Act of 1973, bald eagles made a remarkable recovery and were removed from the endangered list in 2007.", "vids": [{"label": "The Bald Eagle — America's Symbol", "url": "https://www.youtube.com/watch?v=Po4fkuVE1bE", "note": "Bald Eagle Symbol"}]}, "grammar": {"std": "L.4.5.c", "topic": "Word Relationships: Synonyms & Antonyms", "lesson": "Synonyms are words with similar meanings. Antonyms are words with opposite meanings. Knowing synonyms helps you avoid repeating the same word. Knowing antonyms helps you understand contrast. Examples: 'Majestic' synonyms: grand, magnificent, impressive. 'Endangered' antonym: thriving, abundant, safe.", "exercises": [{"type": "mc", "q": "Which word is a synonym for 'powerful'?", "opts": ["weak", "small", "mighty", "gentle"], "ans": 2}, {"type": "fill", "sentence": "The bald eagle was endangered, but thanks to conservation it is now ___ and healthy. (antonym of endangered)", "ans": "thriving", "hint": "What word means doing very well and growing strong?"}, {"type": "spot", "q": "Click the word that is an antonym of 'remarkable':", "words": ["extraordinary", "impressive", "ordinary", "outstanding"], "errorIdx": 2, "errorCorrect": "ordinary", "explain": "'Ordinary' means usual and common — the opposite of 'remarkable,' which means unusual and special."}]}, "write": {"milestone": "Week 4 — Stanza 4: Symbol & Country", "prompt": "Write Stanza 4 (4 lines) about how your symbol connects to America as a whole. How does it make Americans feel? Use at least one synonym pair — use two different words that mean similar things in your stanza."}, "words": [{"w": "endangered", "ph": "en-DAYN-jerd", "pos": "adjective", "def": "At risk of dying out completely", "ex": "Bald eagles were once endangered but have recovered."}, {"w": "conservation", "ph": "kon-ser-VAY-shun", "pos": "noun", "def": "The protection and careful management of natural resources", "ex": "Conservation efforts helped save the bald eagle."}, {"w": "pesticide", "ph": "PES-tih-syd", "pos": "noun", "def": "A chemical used to kill insects or pests that harm crops", "ex": "The pesticide DDT was harmful to bald eagle eggs."}, {"w": "wingspan", "ph": "WING-span", "pos": "noun", "def": "The distance from the tip of one wing to the other when spread", "ex": "A bald eagle's wingspan can reach up to 8 feet."}, {"w": "recovery", "ph": "rih-KUV-er-ee", "pos": "noun", "def": "The process of returning to a normal, healthy condition", "ex": "The bald eagle's recovery is a conservation success story."}, {"w": "predator", "ph": "PRED-uh-ter", "pos": "noun", "def": "An animal that hunts and eats other animals", "ex": "The bald eagle is a skilled predator that hunts fish."}, {"w": "habitat", "ph": "HAB-ih-tat", "pos": "noun", "def": "The natural environment where an animal or plant lives", "ex": "Bald eagles need clean water habitats to survive."}, {"w": "majestic", "ph": "muh-JES-tik", "pos": "adjective", "def": "Grand, impressive, and inspiring admiration", "ex": "The majestic bald eagle soars high above the river."}, {"w": "synonym", "ph": "SIN-oh-nim", "pos": "noun", "def": "A word that has the same or similar meaning as another word", "ex": "'Brave' and 'courageous' are synonyms."}, {"w": "antonym", "ph": "AN-toh-nim", "pos": "noun", "def": "A word that has the opposite meaning of another word", "ex": "'Endangered' and 'thriving' are antonyms."}], "book_quiz": {"title": "Betsy Ross and the American Flag — Week 4 Reading", "questions": [{"q": "What happened to the flag design over time?", "opts": ["It stayed the same", "Stars and stripes were added as new states joined", "It changed colors", "The stripes were removed"], "ans": 1}, {"q": "What does the flag mean to most Americans?", "opts": ["Just a decoration", "A symbol of freedom, unity, and national pride", "A sign of the military only", "A reminder of war"], "ans": 1}, {"q": "How many stars does the current flag have?", "opts": ["13", "48", "50", "52"], "ans": 2}, {"q": "When was the last star added to the flag?", "opts": ["1945", "1959", "1960", "1776"], "ans": 2}, {"q": "Why is the story of Betsy Ross important?", "opts": ["She was the first president's wife", "She shows how one person can contribute to history", "She designed the Constitution", "She led an army"], "ans": 1}]}, "quiz": [{"q": "When did the bald eagle become the national bird?", "opts": ["1776", "1782", "1800", "1865"], "ans": 1}, {"q": "Why were bald eagles endangered?", "opts": ["They flew away", "Hunting and the pesticide DDT harmed them", "They ran out of food", "They moved to Canada"], "ans": 1}, {"q": "When were bald eagles removed from the endangered list?", "opts": ["1973", "1990", "2000", "2007"], "ans": 3}, {"q": "What is a synonym?", "opts": ["A word with the opposite meaning", "A word with a similar meaning", "A describing word", "A connecting word"], "ans": 1}, {"q": "What is an antonym of 'endangered'?", "opts": ["threatened", "extinct", "thriving", "rare"], "ans": 2}, {"q": "What is conservation?", "opts": ["Building new cities", "The protection of natural resources", "A type of pesticide", "Hunting animals"], "ans": 1}, {"q": "What can a bald eagle's wingspan reach?", "opts": ["3 feet", "5 feet", "8 feet", "12 feet"], "ans": 2}, {"q": "What does a bald eagle mainly eat?", "opts": ["Berries", "Small mammals only", "Fish", "Insects"], "ans": 2}, {"q": "What does 'majestic' mean?", "opts": ["Small and timid", "Grand and inspiring admiration", "Fast and aggressive", "Rare and endangered"], "ans": 1}, {"q": "What law helped protect the bald eagle?", "opts": ["The Civil Rights Act", "The Constitution", "The Endangered Species Act of 1973", "The Flag Protection Act"], "ans": 2}]}, {"num": 5, "title": "The National Anthem", "read": {"title": "The Star-Spangled Banner", "text": "The national anthem of the United States is 'The Star-Spangled Banner.' It was written by Francis Scott Key during the War of 1812. Key watched a battle at Fort McHenry in Maryland and was inspired when he saw the American flag still flying after a night of British bombardment. He wrote a poem about what he saw, and later it was set to music. Congress made it the official national anthem in 1931. The song asks a question: can you still see the flag 'by the dawn's early light'? It celebrates American perseverance and the flag as a symbol of survival and hope.", "vids": []}, "grammar": {"std": "L.4.4.b", "topic": "Latin Roots: nat- and lib-", "lesson": "The Latin root 'nat-' means 'born' or 'of a place.' The root 'lib-' means 'free.' Examples: nation (a country where people are born), native (born in a place), natural (existing from birth), liberty (freedom), liberate (to set free), liberal (open to freedom). Knowing these roots helps you understand hundreds of English words!", "exercises": [{"type": "mc", "q": "If 'nat-' means born or of a place, what does 'native' most likely mean?", "opts": ["A person who travels", "Someone born in or originally from a place", "A government leader", "A type of symbol"], "ans": 1}, {"type": "fill", "sentence": "The ___ anthem is played before sports events to honor the country. (nat- word)", "ans": "national", "hint": "Think of the Latin root 'nat-' meaning born or of a place."}, {"type": "spot", "q": "Which word contains the root 'lib-' meaning free?", "words": ["library", "liberate", "liberal", "liberty"], "errorIdx": 0, "errorCorrect": "(all contain lib- but library = lib- as in book, not free)", "explain": "'Library' actually comes from 'liber' meaning book in Latin, not liberty. 'Liberate,' 'liberal,' and 'liberty' all come from the 'lib-' root meaning free."}]}, "write": {"milestone": "Week 5 — Stanza 5 & Final Poem", "prompt": "Write Stanza 5 (4 lines): your personal feelings about this symbol — what does it mean to YOU? Then put all 5 stanzas together and give your poem a title. Read it aloud and check that each stanza has 4 lines."}, "words": [{"w": "anthem", "ph": "AN-them", "pos": "noun", "def": "An official song chosen to represent a country, school, or group", "ex": "'The Star-Spangled Banner' is America's national anthem."}, {"w": "bombardment", "ph": "bom-BARD-ment", "pos": "noun", "def": "A heavy attack with bombs or cannon fire over a period of time", "ex": "Fort McHenry survived a night of British bombardment."}, {"w": "perseverance", "ph": "per-seh-VEER-ants", "pos": "noun", "def": "Continuing to try even when things are very difficult", "ex": "The anthem celebrates American perseverance through hard times."}, {"w": "dawn", "ph": "DAWN", "pos": "noun", "def": "The time of day when the sun first appears; early morning", "ex": "Francis Scott Key watched the battle until the dawn."}, {"w": "inspire", "ph": "in-SPY-er", "pos": "verb", "def": "To fill someone with a strong feeling or new idea", "ex": "The sight of the flag inspired Francis Scott Key to write a poem."}, {"w": "liberate", "ph": "LIB-er-ayt", "pos": "verb", "def": "To set someone free from control or imprisonment", "ex": "The soldiers fought to liberate the fort from enemy control."}, {"w": "native", "ph": "NAY-tiv", "pos": "adjective/noun", "def": "Born in or originally from a particular place", "ex": "Key was a native of Maryland."}, {"w": "national", "ph": "NASH-uh-nul", "pos": "adjective", "def": "Relating to or belonging to a whole nation", "ex": "The national anthem is played at official ceremonies."}, {"w": "survival", "ph": "ser-VY-vul", "pos": "noun", "def": "Continuing to live or exist after a difficult event", "ex": "The flag's survival through the battle inspired Key's poem."}, {"w": "official", "ph": "oh-FISH-ul", "pos": "adjective", "def": "Formally approved by an authority or government", "ex": "Congress made 'The Star-Spangled Banner' the official anthem in 1931."}], "quiz": [{"q": "Who wrote 'The Star-Spangled Banner'?", "opts": ["George Washington", "Thomas Jefferson", "Francis Scott Key", "Benjamin Franklin"], "ans": 2}, {"q": "During which war was it written?", "opts": ["Civil War", "Revolutionary War", "War of 1812", "World War I"], "ans": 2}, {"q": "What inspired Francis Scott Key to write the poem?", "opts": ["A parade", "Seeing the flag flying after a night of battle", "A speech by the president", "A fireworks display"], "ans": 1}, {"q": "When did Congress make it the official national anthem?", "opts": ["1812", "1865", "1918", "1931"], "ans": 3}, {"q": "What does the Latin root 'lib-' mean?", "opts": ["Land", "Born", "Free", "Strong"], "ans": 2}, {"q": "What does the Latin root 'nat-' mean?", "opts": ["Free", "Strong", "Born or of a place", "Water"], "ans": 2}, {"q": "What does 'perseverance' mean?", "opts": ["Giving up", "Continuing to try even when things are difficult", "Being very fast", "Feeling joyful"], "ans": 1}, {"q": "What does 'bombard' mean?", "opts": ["To cheer loudly", "To heavily attack", "To protect a fort", "To write a poem"], "ans": 1}, {"q": "What question does the Star-Spangled Banner ask?", "opts": ["Who is the president?", "Can you see the flag?", "Where is freedom?", "When will the war end?"], "ans": 1}, {"q": "What does 'liberate' mean?", "opts": ["To imprison", "To set free", "To celebrate", "To build"], "ans": 1}]}]}, {"id": 3, "title": "How Government Works", "sub": "Democracy in Action", "color": "#38a169", "icon": "🏛️", "book": {"title": "Grace for President", "author": "Kelly DiPucchio", "note": "Week 1"}, "writing_project": {"title": "Letter to My Representative", "desc": "Write a formal letter to a U.S. Representative about an issue that matters to you. Each week you'll build one part of the letter."}, "weeks": [{"num": 1, "title": "Democracy & Voting", "read": {"title": "What Is Democracy?", "text": "Democracy is a system of government where the people hold the power. In a democracy, citizens vote to choose their leaders and make important decisions. The word 'democracy' comes from two Greek words: 'demos' meaning people, and 'kratos' meaning power or rule. Ancient Greece, especially the city of Athens, was one of the first places to practice democracy over 2,500 years ago. The United States is a representative democracy, which means citizens elect representatives to make laws on their behalf. Every citizen who is 18 or older has the right to vote. Voting is one of the most important ways Americans participate in their government.", "vids": [{"label": "What Is Democracy? For Kids", "url": "https://www.youtube.com/watch?v=CmrO44KM7yk", "note": "Democracy Explained"}]}, "grammar": {"std": "L.4.3.a", "topic": "Word Choice for Your Audience", "lesson": "Good writers think about WHO will read their writing and choose words that fit. When writing for young children, use simple words. When writing for adults or officials, use formal, precise language. Example — informal: 'The government does stuff for us.' Formal: 'The government provides essential services for citizens.' Choose words that match your audience and purpose!", "exercises": [{"type": "mc", "q": "You are writing a letter to your congressperson. Which opening is more appropriate?", "opts": ["Hey, I wanted to talk about something cool.", "Dear Representative, I am writing to express my concern about...", "Sup, so I think you should know...", "Hi! Democracy is awesome and I love voting!"], "ans": 1}, {"type": "fill", "sentence": "When writing formally, replace 'kids' with ___.", "ans": "children", "hint": "What is the more formal word for young people?"}, {"type": "spot", "q": "Click the word that is too informal for a formal letter:", "words": ["I", "am", "writing", "to", "express", "my", "awesome", "concern."], "errorIdx": 6, "errorCorrect": "strong/sincere", "explain": "'Awesome' is informal slang. In a formal letter, use 'strong,' 'sincere,' or 'deep' instead."}]}, "write": {"milestone": "Week 1 — Choose Your Issue & Write the Greeting", "prompt": "What issue do you care about? (Example: school safety, the environment, animal protection, helping homeless people.) Write the heading and greeting for your letter. Include: your address, the date, the representative's name and address, and 'Dear Representative [Name]:'"}, "words": [{"w": "democracy", "ph": "deh-MOK-ruh-see", "pos": "noun", "def": "A government system where the people hold power through voting", "ex": "The United States is a democracy where citizens elect their leaders."}, {"w": "citizen", "ph": "SIT-ih-zen", "pos": "noun", "def": "A person who belongs to a country and has rights and responsibilities there", "ex": "Every citizen 18 and older has the right to vote."}, {"w": "representative", "ph": "rep-rih-ZEN-tuh-tiv", "pos": "noun", "def": "A person chosen to speak or act for others", "ex": "We elect a representative to speak for us in Congress."}, {"w": "elect", "ph": "ih-LEKT", "pos": "verb", "def": "To choose someone for a position by voting", "ex": "Americans elect a new president every four years."}, {"w": "vote", "ph": "VOHT", "pos": "verb/noun", "def": "To make a choice in an election; the choice itself", "ex": "Every vote counts in a democracy."}, {"w": "legislature", "ph": "LEJ-ih-slay-cher", "pos": "noun", "def": "A group of elected people who have the power to make laws", "ex": "The U.S. Congress is the national legislature."}, {"w": "participate", "ph": "par-TIS-ih-payt", "pos": "verb", "def": "To take part in an activity or event", "ex": "Citizens participate in democracy by voting and contacting their representatives."}, {"w": "republic", "ph": "rih-PUB-lik", "pos": "noun", "def": "A government where citizens elect representatives to make decisions for them", "ex": "The United States is a constitutional republic."}, {"w": "petition", "ph": "peh-TIH-shun", "pos": "noun/verb", "def": "A written request signed by many people; to formally request something", "ex": "Students gathered signatures on a petition for a new school garden."}, {"w": "constitution", "ph": "kon-stih-TOO-shun", "pos": "noun", "def": "The document that describes the basic laws and principles of a government", "ex": "The U.S. Constitution is the supreme law of the land."}], "book_quiz": {"title": "Grace for President — Reading Quiz", "questions": [{"q": "What did Grace discover that surprised her at the beginning of the book?", "opts": ["There was no school that day", "There had never been a female U.S. president", "Her class had a new teacher", "The cafeteria had new food"], "ans": 1}, {"q": "What did Grace decide to do after her discovery?", "opts": ["Write a letter to Congress", "Run for class president", "Start a petition", "Go on strike"], "ans": 1}, {
